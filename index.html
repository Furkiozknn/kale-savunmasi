  #toast div.good { border-left-color: #4ade80; }

  #boss { position: fixed; left: 50%; top: calc(var(--top-h) + 14px); transform: translateX(-50%); z-index: 5; width: min(360px, calc(100% - 32px)); padding: 6px 10px; display: none; font-weight: 700; font-size: 13px; }
  #boss.on { display: block; }

function update(dt) {

  }
  // enemies
  for (const e of G.enemies) {
    if (!e.alive) continue;

    if (e.dotT > 0) { e.dotT -= dt; damage(e, e.dotDps * dt, e.dotTower, 'dot'); if (!e.alive) continue; }

    e.d += e.speed * (e.slowT > 0 ? e.slowF : 1) * dt;
    e.bob += dt * e.speed * 3;
    if (e.d >= e.path.len) { reachEnd(e); if (G.over) return; continue; }
    placeEnemy(e);
  }
  // towers
  for (const tw of G.towers) {
    tw.cd -= dt;
    if (tw.recoil > 0) tw.recoil = Math.max(0, tw.recoil - dt * 4);
    const e = findTarget(tw);
    if (e) {

      let d = want - tw.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));

    }

    if (a.e.alive) { a.tx = a.e.x; a.tz = a.e.z; }
    const dx = a.tx - a.x, dy = 0.9 - a.y, dz = a.tz - a.z, dist = Math.hypot(dx, dy, dz), step = 32 * dt;
    a.life -= dt;

            e.dotT = 3; e.dotTower = tw;
            e.slowT = 2.6; e.slowF = Math.min(e.slowF, stat(tw, 'slow'));

          if (puddles.items.length < 40) puddles.items.push({ x: b.x1, z: b.z1, r, life: 3, max: 3, slow: stat(tw, 'slow') });
          sfx('splash');

    setBattleMusic(false);

}

}

const panel = document.getElementById('panel');

}
const closeBtn = () => `<button class="x" data-act="close" aria-label="${t('close')}">✕</button>`;
function showBuild(pad) {

    TOWER_KEYS.map((k, i) => {

function fmt(v) { return typeof v === 'number' && !Number.isInteger(v) ? v.toFixed(1) : v; }
// The tower panel is rebuilt only when the tower, its level, its target mode or the language changes. Gold and kill

function showTower(tw) {

  if (key !== panelKey || panel.classList.contains('hidden')) {
    panelKey = key;
    const T = TOWERS[tw.type], L = tw.level, nx = L < 2 ? L + 1 : null;
    const row = (label, k, f = v => v) => {
      const cur = f(T[k][L]), nxt = nx !== null ? f(T[k][nx]) : null;
      return `<div><span>${label}</span><b>${fmt(cur)}${nxt !== null && nxt !== cur ? ` <span class="up">→ ${fmt(nxt)}</span>` : ''}</b></div>`;
    };

    if (tw.type === 'tar') rows += row(t('dps'), 'dps') + row(t('slow'), 'slow', v => Math.round((1 - v) * 100) + '%');
    else rows += row(t('dmg'), 'dmg');
    rows += row(t('rate'), 'rate', v => +(1 / v).toFixed(1));
    if (T.splash) rows += row(t('splash'), 'splash');
    rows += `<div><span>${t('kills')}</span><b data-live="kills"></b></div>`;
    const up = nx !== null ? T.cost[nx] : 0;

    panel.innerHTML = `<div class="ph"><span>${ico(tw.type)} ${t(tw.type + 'Name')}<span class="lvl">${[0, 1, 2].map(i => `<i class="${i <= L ? 'on' : ''}"></i>`).join('')}</span></span>${closeBtn()}</div>
      <div class="tw"><div class="tstats">${rows}</div><div class="tbtns">
        <button class="primary" data-act="upgrade" data-cost="${nx === null ? '' : up}">${nx === null ? t('maxed') : `${ico('upgrade')} ${t('upgrade')} · ${ico('gold')} ${up}`}</button>
        <button data-act="mode">${ico('target')} ${t('target')}: ${modeName}</button>
        <button data-act="sell">${t('sell')} · +<span data-live="refund"></span></button></div></div>`;
  }

}
function updatePanelLive() {

  if (!sel.tower) { panel.querySelectorAll('[data-act="build"]').forEach(b => { b.disabled = G.gold < TOWERS[b.dataset.type].cost[0]; }); return; }
  const tw = sel.tower, kills = panel.querySelector('[data-live="kills"]'), refund = panel.querySelector('[data-live="refund"]'), up = panel.querySelector('[data-act="upgrade"]');

  else if (!sel.pad.tower) updatePanelLive();

}
function cycleMode(tw) {

  else if (act === 'build' && sel) { if (buildTower(sel.pad, b.dataset.type)) showTower(sel.pad.tower); }
  else if (act === 'upgrade' && sel?.tower) upgradeTower(sel.tower);

// a tap selects a pad; a drag, or any gesture that had two fingers down at some point, does not
const pointers = new Map();
let down = null, multi = false;
canvas.addEventListener('pointerdown', ev => {
  pointers.set(ev.pointerId, true);
  if (pointers.size === 1) { down = { x: ev.clientX, y: ev.clientY }; multi = false; } else multi = true;
});
const pointerGone = ev => { pointers.delete(ev.pointerId); };
canvas.addEventListener('pointercancel', pointerGone);
canvas.addEventListener('pointerup', ev => {
  pointerGone(ev);
  if (!down || !G.running || G.paused) return;
  if (multi) { if (!pointers.size) down = null; return; }
  const moved = Math.hypot(ev.clientX - down.x, ev.clientY - down.y);
  down = null;

// ---------------------------------------------------------------- HUD
const $ = id => document.getElementById(id);

let lastGold = -1, previewKey = '';

function toast(msg, kind = 'info') {

// big "Wave 7" banner with the wave's enemies, red for a battering-ram wave
let bannerTimer = 0;
function waveBanner(w, boss) {
  const el = $('banner'), wc = waveCounts(w);
  el.innerHTML = `<b>${t('wave')} ${w}</b><span>${ENEMY_KEYS.filter(k => wc[k]).map(k => `${ico(k)} ${wc[k]}`).join('')}</span>`;

  const h = el.offsetHeight, tb = $('toast').getBoundingClientRect(), wb = $('wavebox').getBoundingClientRect();
  const floor = (wb.left < (innerWidth + el.offsetWidth) / 2 ? wb.top : innerHeight) - 8 - h / 2;
  el.style.top = Math.min(Math.max(parseFloat(getComputedStyle(el).top), tb.bottom + 10 + h / 2), floor) + 'px';

// boss health bar under the top bar while a battering ram is on the road
let bossShown = false, bossFrac = -1;
function updateBossBar(hp, max) {
  const on = max > 0 && G.running && !G.over;
  if (on !== bossShown) { bossShown = on; $('boss').classList.toggle('on', on); document.body.classList.toggle('boss', on); }
  if (!on) return;
  const f = Math.round(clamp(hp / max, 0, 1) * 200) / 200;
  if (f !== bossFrac) { bossFrac = f; $('bossBar').style.transform = `scaleX(${f})`; }
}
const ftxt = [], ftxtLayer = $('ftxt');
function floatText(s, x, y, z) {
  if (ftxt.length > 24) return;
  const el = document.createElement('div');
  el.textContent = s;
  ftxtLayer.appendChild(el);
  ftxt.push({ el, x, y, z, life: 1 });
}
function updateFloatText(dt) {
  for (const f of ftxt) {
    f.life -= dt; f.y += dt * 1.6;
    _v.set(f.x, f.y, f.z).project(camera);
    f.el.style.transform = `translate(${(_v.x * 0.5 + 0.5) * innerWidth - 12}px, ${(-_v.y * 0.5 + 0.5) * innerHeight - 10}px)`;
    f.el.style.opacity = Math.min(1, f.life * 2);
    if (f.life <= 0) f.el.remove();

  for (let i = ftxt.length - 1; i >= 0; i--) if (ftxt[i].life <= 0) ftxt.splice(i, 1);

  tip('sGold', 'gold'); tip('sLives', 'lives'); tip('sWave', 'wave');
  tip('bSpeed', 'speed', 'F'); tip('bPause', 'pause', 'P'); tip('bSound', 'sound'); tip('bLang', 'language', 'L');

$('bSound').onclick = () => {

// a mouse click on a HUD or panel button drops its focus again, so Space keeps calling waves instead of pressing it
document.addEventListener('click', ev => { if (ev.detail > 0 && ev.target.closest?.('#top, #wavebox, #panel')) document.activeElement?.blur?.(); });
window.addEventListener('keydown', ev => {
  if (ev.repeat || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toLowerCase(), focused = document.activeElement?.tagName;
  if (focused === 'INPUT' && k !== 'escape') return; // sliders keep the arrow keys
  // Esc goes back one step: settings, then the pad panel, then pause; P always pauses or resumes
  if (k === 'escape') {
    if (screen === 'settings') settingsBack();
    else if (sel && !G.paused) closePanel();
    else if (G.running && !G.over) setPaused(!G.paused);
    return;
  }
  if (k === 'p') {
    if (screen === 'settings' && settingsFrom === 'pause') settingsBack();
    else if (G.running && !G.over) setPaused(!G.paused);
    return;
  }
  if (k === 'm') { toggleMusic(); return; }
  if (k === 'x') { toggleSfx(); return; }
  if (k === 'l') { toggleLang(); return; }
  if (screen) return; // an overlay card is open: no gameplay keys
  if (k === ' ') {
    if (focused === 'BUTTON') return; // Space presses the focused button
    ev.preventDefault(); initAudio(); startWave();
  }
  else if (k === 'f') $('bSpeed').click();
  else if (sel && !sel.tower && ['1', '2', '3'].includes(k)) { if (buildTower(sel.pad, TOWER_KEYS[+k - 1])) showTower(sel.pad.tower); }
  else if (sel?.tower && k === 'u') upgradeTower(sel.tower);
  else if (sel?.tower && k === 's') sellTower(sel.tower);
  else if (sel?.tower && k === 't') cycleMode(sel.tower);
});

// ---------------------------------------------------------------- run save (Continue), written after every cleared wave
function saveRun() {
  if (G.over || !G.running) return;
  store.set('arena.hisar.save', JSON.stringify({
    version: 1, wave: G.wave, gold: G.gold, lives: G.lives, endless: G.endless, kills: G.kills, gold_earned: G.goldEarned, built: G.built,
    towers: G.towers.map(tw => ({ pad: tw.pad.i, type: tw.type, level: tw.level, mode: tw.mode, spent: tw.spent, kills: tw.kills, yaw: tw.yaw })),
  }));
}
function loadRun() {
  if (AUTO) return null;
  try { const s = JSON.parse(store.get('arena.hisar.save')); return s && s.version === 1 && s.wave > 0 && s.lives > 0 ? s : null; } catch (e) { return null; }
}
function clearRun() { store.del('arena.hisar.save'); }
function restoreRun(s) {
  Object.assign(G, { wave: s.wave | 0, gold: s.gold | 0, lives: s.lives | 0, endless: !!s.endless, kills: s.kills | 0, goldEarned: s.gold_earned | 0, built: s.built | 0 });
  for (const d of s.towers || []) {
    const pad = pads[d.pad];
    if (!pad || pad.tower || !TOWERS[d.type]) continue;
    const tw = placeTower(pad, d.type, clamp(d.level | 0, 0, 2));
    tw.mode = ['first', 'strong', 'near'].includes(d.mode) ? d.mode : 'first';
    tw.spent = d.spent | 0; tw.kills = d.kills | 0; tw.yaw = +d.yaw || 0;
  }
}

const FULLSCREEN = !!(document.fullscreenEnabled && document.documentElement.requestFullscreen);

// ---------------------------------------------------------------- game flow (restart in place, no page reload)
function resetGame() {
  closePanel();
  for (const tw of G.towers) { scene.remove(tw.base, tw.head); tw.pad.tower = null; }
  for (const p of pads) p.tower = null;
  for (const list of [arrows, balls, tars, puddles]) list.items = [];
  pl.fill(0);
  for (let i = 0; i < PMAX; i++) pPos[i * 3 + 1] = -999;
  pGeo.attributes.position.needsUpdate = true;
  clearFloatText();
  $('toast').innerHTML = '';
  Object.assign(G, { running: false, over: false, paused: false, gold: START_GOLD, lives: START_LIVES, wave: 0, phase: 'build', queue: [], waveTime: 0,
    pendingBonus: 0, endless: false, enemies: [], towers: [], kills: 0, goldEarned: 0, built: 0 });

}

// ---------------------------------------------------------------- quality
function applyQuality() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, low ? 1 : 1.5));
  renderer.setSize(innerWidth, innerHeight);
  if (renderer.shadowMap.enabled === low) {
    renderer.shadowMap.enabled = sun.castShadow = !low;
    scene.traverse(o => { if (o.material) for (const m of [].concat(o.material)) m.needsUpdate = true; }); // recompile with / without shadows
  }
  for (const [m, full, part] of lodMeshes) m.count = low ? Math.min(part, full) : full;
}

// ---------------------------------------------------------------- audio (all synthesised)
// master -> destination; sfx and music each have their own gain, so the settings sliders and the M / X keys work separately
let ac = null, master = null, sfxBus = null, musicBus = null, drumsGain = null, noiseBuf = null, musicStarted = false, drumsOn = false;
if (AUTO) settings.master = 0; // shows the muted icon for the silent bot (never saved: the store is read-only under ?auto)
function initAudio() {
  if (AUTO) return; // the bot plays silently
  if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => { /* needs a gesture */ }); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.connect(master);
    drumsGain = ac.createGain(); drumsGain.gain.value = drumsOn ? 0.71 : 0.0001; drumsGain.connect(musicBus);
    applyVolumes();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setTimeout(startMusic, 30); // render the loop just after the click, so the click itself stays instant
  } catch (e) { ac = null; }
}
function applyVolumes() {
  if (!ac) return;
  master.gain.value = 0.4 * settings.master; // 0.32 at the default 0.8, the level from before the overnight pass
  sfxBus.gain.value = settings.sfxOn ? settings.sfx / 0.8 : 0;
  musicBus.gain.value = settings.musicOn ? settings.music / 2.4 : 0; // the same music / effects balance as the Godot version
}
function tone(f, dur, type = 'sine', vol = 0.3, f2 = null, delay = 0) {
  const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);

  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(sfxBus); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, freq, type = 'lowpass', delay = 0, q = 1) {
  const t0 = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f).connect(g).connect(sfxBus); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
}
const lastSfx = {};
function sfx(name) {
  if (!ac || ac.state !== 'running' || master.gain.value < 0.001 || sfxBus.gain.value < 0.001) return;
  const now = ac.currentTime, gap = { bow: 0.06, hit: 0.05, coin: 0.07, boom: 0.08, impact: 0.08, lob: 0.1, splash: 0.1 }[name] ?? 0.03;
  if (lastSfx[name] && now - lastSfx[name] < gap) return;
  lastSfx[name] = now;
  switch (name) {
    case 'bow': noise(0.08, 0.12, 2800, 'bandpass', 0, 2); tone(420, 0.07, 'triangle', 0.05, 180); break;
    case 'hit': noise(0.05, 0.08, 1200, 'bandpass', 0, 3); break;
    case 'boom': noise(0.4, 0.5, 420); tone(110, 0.35, 'sine', 0.4, 40); break;
    case 'impact': noise(0.3, 0.3, 700); tone(80, 0.25, 'sine', 0.25, 35); break;
    case 'lob': tone(260, 0.16, 'triangle', 0.08, 140); break;
    case 'splash': noise(0.22, 0.18, 500, 'lowpass', 0, 4); break;
    case 'coin': tone(1320, 0.06, 'square', 0.04); tone(1760, 0.09, 'square', 0.04, null, 0.05); break;
    case 'build': noise(0.15, 0.2, 300); tone(196, 0.12, 'triangle', 0.15, null, 0.02); tone(294, 0.15, 'triangle', 0.12, null, 0.1); break;
    case 'upgrade': noise(0.12, 0.15, 400); [392, 523, 659].forEach((f, i) => tone(f, 0.2, 'triangle', 0.12, null, 0.05 + i * 0.08)); break;
    case 'click': tone(660, 0.04, 'triangle', 0.06); break;
    case 'deny': tone(180, 0.15, 'square', 0.06, 140); break;
    case 'hurt': noise(0.35, 0.35, 260); tone(150, 0.3, 'sawtooth', 0.12, 70); break;
    case 'horn': [146.8, 220, 293.7].forEach((f, i) => tone(f, 0.9, 'sawtooth', 0.06, f * 0.98, i * 0.03)); break;
    case 'boss': tone(98, 1.5, 'sawtooth', 0.08, 92); tone(147, 1.5, 'sawtooth', 0.06, 140); tone(196, 1.2, 'sawtooth', 0.05, 190, 0.25); break;
    case 'clear': [523, 659, 784].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, null, i * 0.1)); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.5, 'triangle', 0.12, null, i * 0.16)); break;
    case 'lose': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.5, 'sawtooth', 0.07, null, i * 0.22)); break;
  }
}

// Music, ported from the Godot version: a two-stem loop in 9/8 (2+2+2+3) in the Hicaz mode. The calm stem (drone, saz-like
// plucked melody, bass) always plays; the drum stem (düm / tek / zil) fades in while a wave is running.
const MUSIC_RATE = 22050, EIGHTH = 0.2, D4 = 293.66;
const MELODY = [ // [start eighth, length in eighths, semitones from D4], 8 bars
  [0, 2, 7], [2, 2, 8], [4, 2, 7], [6, 3, 5], [9, 2, 4], [11, 2, 5], [13, 1, 4], [14, 1, 1], [15, 3, 0],
  [18, 2, 0], [20, 2, 1], [22, 2, 4], [24, 3, 5], [27, 2, 7], [29, 2, 5], [31, 2, 4], [33, 3, 7],
  [36, 2, 12], [38, 2, 10], [40, 2, 8], [42, 3, 7], [45, 2, 8], [47, 2, 7], [49, 2, 5], [51, 3, 4],
  [54, 2, 5], [56, 2, 4], [58, 2, 1], [60, 3, 4], [63, 2, 1], [65, 2, 0], [67, 5, 0],
];
const BASS = [0, 0, -5, 0, 5, 1, -2, 0];
async function renderMusic() {
  const breathe = () => new Promise(r => setTimeout(r, 0)); // render in slices so the game keeps running smoothly
  let s = 1453; // own random stream, so the music never shifts the game's seeded one
  const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  const R = MUSIC_RATE, len = 8 * 9 * EIGHTH, N = Math.floor(len * R);
  const calm = new Float32Array(N), drums = new Float32Array(N);
  const wave = (k, p) => { p -= Math.floor(p); return k === 'triangle' ? 4 * Math.abs(p - 0.5) - 1 : Math.sin(p * Math.PI * 2); };
  const toneInto = (b, start, dur, f0, f1, kind, vol) => {
    const i0 = Math.floor(start * R), n = Math.floor(dur * R), ratio = f1 > 0 ? f1 / f0 : 1, fall = Math.log(0.0001 / Math.max(vol, 0.0002));
    let ph = 0;
    for (let i = 0; i < n && i0 + i < N; i++) {
      const tt = i / R; ph += f0 * Math.pow(ratio, tt / dur) / R;
      b[i0 + i] += wave(kind, ph) * (tt < 0.01 ? vol * tt / 0.01 : vol * Math.exp(fall * (tt - 0.01) / Math.max(0.001, dur - 0.01)));
    }
  };
  const noiseInto = (b, start, dur, vol, freq, mode, q) => { // RBJ biquad over white noise
    const w0 = 2 * Math.PI * freq / R, al = Math.sin(w0) / (2 * q), cw = Math.cos(w0), a0 = 1 + al;
    const [b0, b1, b2] = mode === 'bandpass' ? [al, 0, -al] : [(1 - cw) / 2, 1 - cw, (1 - cw) / 2];
    const a1 = -2 * cw / a0, a2 = (1 - al) / a0, fall = Math.log(0.0001 / Math.max(vol, 0.0002));
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    const i0 = Math.floor(start * R), n = Math.floor(dur * R);
    for (let i = 0; i < n && i0 + i < N; i++) {
      const x = rnd() * 2 - 1, y = (b0 * x + b1 * x1 + b2 * x2) / a0 - a1 * y1 - a2 * y2;
      x2 = x1; x1 = x; y2 = y1; y1 = y;
      b[i0 + i] += y * vol * Math.exp(fall * (i / R) / dur);
    }
  };
  const pluck = (b, start, dur, f, vol, damp) => { // Karplus-Strong string
    const period = Math.max(2, Math.floor(R / f)), ring = new Float32Array(period);
    for (let i = 0; i < period; i++) ring[i] = rnd() * 2 - 1;
    const i0 = Math.floor(start * R), n = Math.floor(dur * R), tail = Math.floor(0.04 * R);
    let pos = 0;
    for (let i = 0; i < n && i0 + i < N; i++) {
      const nx = (pos + 1) % period, out = ring[pos];
      ring[pos] = damp * 0.5 * (ring[pos] + ring[nx]); pos = nx;
      b[i0 + i] += out * vol * (i < n - tail ? 1 : (n - i) / tail);
    }
  };
  const normalize = (b, peak) => { let m = 0.0001; for (const v of b) m = Math.max(m, Math.abs(v)); const k = peak / m; for (let i = 0; i < b.length; i++) b[i] *= k; };

  const table = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const p = i / 1024 * Math.PI * 2; table[i] = Math.sin(p) + 0.45 * Math.sin(2 * p) + 0.22 * Math.sin(3 * p) + 0.1 * Math.sin(4 * p); }
  let p1 = 0, p2 = 0;
  for (let i = 0; i < N; i++) {
    if (i % 65536 === 0) await breathe();
    const tt = i / R, swell = 0.75 + 0.25 * Math.sin(tt * Math.PI * 2 / (len / 2));
    p1 += 146.83 * (1 + 0.002 * Math.sin(tt * 5)) / R; p2 += 220 / R;
    calm[i] = (table[((p1 - Math.floor(p1)) * 1023) | 0] * 0.05 + table[((p2 - Math.floor(p2)) * 1023) | 0] * 0.025) * swell;
  }
  await breathe();
  for (const [st, ln, semi] of MELODY) {
    const f = D4 * Math.pow(2, semi / 12);
    pluck(calm, st * EIGHTH, ln * EIGHTH + 0.35, f, 0.32, 0.9965);
    pluck(calm, st * EIGHTH + 0.012, ln * EIGHTH + 0.2, f * 2, 0.07, 0.993);
  }
  BASS.forEach((semi, bar) => {
    const f = D4 * 0.25 * Math.pow(2, semi / 12);
    pluck(calm, bar * 9 * EIGHTH, 9 * EIGHTH, f, 0.4, 0.998);
    pluck(calm, (bar * 9 + 6) * EIGHTH, 3 * EIGHTH, f * 1.5, 0.18, 0.997);
  });
  normalize(calm, 0.7);
  for (let bar = 0; bar < 8; bar++) {
    await breathe();
    const o = bar * 9 * EIGHTH;
    for (const e of [0, 4]) { toneInto(drums, o + e * EIGHTH, 0.32, 95, 48, 'sine', 0.7); noiseInto(drums, o + e * EIGHTH, 0.08, 0.25, 180, 'lowpass', 1); } // düm
    for (const e of [2, 6, 7, 8]) { noiseInto(drums, o + e * EIGHTH, 0.06, e !== 8 ? 0.32 : 0.18, 3200, 'bandpass', 2.5); toneInto(drums, o + e * EIGHTH, 0.05, 640, 520, 'triangle', 0.08); } // tek
    if (bar % 2 === 1) noiseInto(drums, o + 8 * EIGHTH, 0.5, 0.12, 7000, 'bandpass', 1.2); // zil
  }
  normalize(drums, 0.65);
  return [calm, drums];
}
async function startMusic() {
  if (!ac || musicStarted) return;
  musicStarted = true;
  const t0 = performance.now(), stems = await renderMusic(), at = ac.currentTime + 0.1;
  stems.forEach((data, i) => {
    const buf = ac.createBuffer(1, data.length, MUSIC_RATE);
    buf.copyToChannel(data, 0);
    const src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    src.connect(i ? drumsGain : musicBus);
    src.start(at);
  });

}
function setBattleMusic(on) {
  if (on === drumsOn) return;
  drumsOn = on;
  if (!drumsGain) return;
  const g = drumsGain.gain, now = ac.currentTime;
  g.cancelScheduledValues(now); g.setValueAtTime(Math.max(0.0001, g.value), now);
  g.exponentialRampToValueAtTime(on ? 0.71 : 0.0001, now + (on ? 1.5 : 3)); // -3 dB in a wave, silent between waves
}

// ---------------------------------------------------------------- autoplay bot (?auto) for self-testing
const autoPlan = ['archer', 'archer', 'cannon', 'tar', 'archer', 'cannon', 'archer', 'tar', 'cannon', 'archer'];
const autoPads = [...pads].sort((a, b) => Math.hypot(a.x - 12, a.z) - Math.hypot(b.x - 12, b.z));
let autoT = 0, autoBuildIdx = 0;
function autoplay(dt) {
  autoT -= dt;
  if (autoT > 0) return;
  autoT = 0.5;
  const free = autoPads.find(p => !p.tower);
  const type = autoPlan[autoBuildIdx % autoPlan.length];
  const upgr = G.towers.filter(tw => tw.level < 2).sort((a, b) => TOWERS[a.type].cost[a.level + 1] - TOWERS[b.type].cost[b.level + 1])[0];
  if (free && G.gold >= TOWERS[type].cost[0] && (G.towers.length < 8 || !upgr || G.gold > 260)) { buildTower(free, type); autoBuildIdx++; }
  else if (upgr && G.gold >= TOWERS[upgr.type].cost[upgr.level + 1]) upgradeTower(upgr);
  if (G.phase === 'build' && !G.over) startWave();
}

// ---------------------------------------------------------------- camera framing
// Portrait screens (phones) look along the roads from behind the fortress, so the roads run down the screen to the gate
// (the Godot version's portrait preset: yaw π/2, pitch 1.05, distance 60, target (-4, 0, 0)) and keep a 62° horizontal
// field of view so the whole width of the map fits.
const isPortrait = () => innerHeight > innerWidth;
function fitFov() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = isPortrait() ? 2 * Math.atan(Math.tan(31 * Math.PI / 180) / camera.aspect) * 180 / Math.PI : 42;
  camera.updateProjectionMatrix();
}
function cameraHome() {
  if (camParam) return;
  if (isPortrait()) { controls.target.set(-4, 0, 0); camera.position.set(-4 + Math.cos(1.05) * 60, Math.sin(1.05) * 60, 0); }
  // landscape keeps the view the title orbit ended on, as before
}
let wasPortrait = isPortrait();
function onResize() {
  fitFov();
  renderer.setSize(innerWidth, innerHeight);
  if (isPortrait() !== wasPortrait) { wasPortrait = isPortrait(); if (G.running) cameraHome(); }
}
addEventListener('resize', onResize);

// ---------------------------------------------------------------- loop
document.addEventListener('visibilitychange', () => { if (ac) { if (document.hidden) ac.suspend(); else ac.resume().catch(() => { /* needs a gesture */ }); } });
const clock = new THREE.Clock();
let time = 0, perfT = 0, hoverT = 0, fpsEma = 60;
const minT = new THREE.Vector3(-46, 0, -32), maxT = new THREE.Vector3(40, 0, 32);
const dbgEl = document.createElement('div');
if (DEBUG) { dbgEl.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:20;font:600 13px Rubik,sans-serif;background:#000a;color:#fff;padding:4px 8px;border-radius:6px;pointer-events:none'; document.body.appendChild(dbgEl); }
const camParam = params.get('cam');
function frame() {
  requestAnimationFrame(frame);
  const raw = clock.getDelta(), dt = Math.min(0.05, raw);
  time += dt;
  if (raw > 0) fpsEma += (1 / raw - fpsEma) * 0.05;
  const active = G.running && !G.over && !G.paused && !document.hidden;
  if (active) {
    if (AUTO) autoplay(dt * G.speed);
    let sim = dt * G.speed;
    while (sim > 1e-6 && !G.over) { const s = Math.min(0.025, sim); update(s); sim -= s; }
  }
  updateVisuals(active ? dt * G.speed : (G.paused ? 0 : dt), time);
  updateFloatText(dt);
  // hover highlight (throttled)
  hoverT -= dt;
  if (lastMove && hoverT <= 0 && G.running && !screen) {
    hoverT = 0.06;
    const p = pick(lastMove.x, lastMove.y), h = p ? p.i : -1;
    canvas.style.cursor = p ? 'pointer' : '';
    if (h !== hoverPad) { hoverPad = h; refreshPadColors(); }
  }
  // title screen: slow cinematic orbit (not when ?cam fixes the view)
  if (!G.running && !camParam) {
    const a = time * 0.05;
    camera.position.set(Math.sin(a) * 62 - 2, 40, Math.cos(a) * 62);
    controls.target.set(-2, 0, 0);
  }
  controls.update();
  const before = controls.target.clone();
  controls.target.clamp(minT, maxT);
  camera.position.add(before.sub(controls.target).negate());
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 1.5);
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    camera.position.x += sx; camera.position.y += sy;
    renderer.render(scene, camera);
    camera.position.x -= sx; camera.position.y -= sy;
  } else renderer.render(scene, camera);
  if (DEBUG) dbgEl.textContent = `draw calls ${renderer.info.render.calls} · triangles ${renderer.info.render.triangles} · ${fpsEma.toFixed(0)} fps · errors ${G.errors.length}`;
  if (DEBUG && (perfT += dt) > 5) { perfT = 0; console.log('[hisar] draw calls', renderer.info.render.calls, 'tris', renderer.info.render.triangles, 'fps', fpsEma.toFixed(1)); }
}

  return { wave: G.wave, lives: G.lives, gold: G.gold, towers: G.towers.map(tw => tw.type[0] + tw.level).join(' '), over: G.over, errors: G.errors.length };
};

}
if (camParam) { const [x, y, z, tx, tz] = camParam.split(',').map(Number); camera.position.set(x, y, z); controls.target.set(tx || 0, 0, tz || 0); }

G.assets = [];
frame();
// the title screen shows while the models load (Play stays disabled); after 15 s the game goes on with whatever has
// loaded, and a model that arrives later is still swapped in
const assetsLoaded = loadAssets().then(() => { if (assetState.done) applyAssets(); });
Promise.race([assetsLoaded, new Promise(r => setTimeout(r, 15000))]).then(() => {
  applyAssets();
  assetState.done = true;
  G.assetsReady = true;
  if (screen === 'title') showScreen('title');
});
</script>
