<head>

<meta property="og:url" content="https://furkiozknn.github.io/kale-savunmasi/">

<link rel="icon" type="image/png" href="assets/ui/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link rel="preload" href="assets/fonts/stardos-stencil-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* 2026-11 Radical UI Rebirth: Ottoman Baroque · Fortress Bastion · Cartographic War Council */
  @font-face { font-family: 'Hisar Stencil'; src: url(assets/fonts/stardos-stencil-700.woff2) format('woff2'); font-weight: 700; font-display: swap; }
  :root {
    --bg-void: #12151b;
    --stone-dark: #201a14;
    --stone-panel: #2b221a;
    --stone-border: #5a4430;
    --parch: #f5ecd6;
    --parch-2: #e3d3b0;
    --parch-tint: rgba(245, 236, 214, 0.94);
    --edge: #8f6c38;
    --ink: #1f1710;
    --ink-soft: #4f3b28;
    --ink-muted: #755a40;
    --rule: rgba(79, 59, 40, 0.32);
    --seal: #b91c1c;
    --seal-light: #dc2626;
    --seal-dark: #6e0f0f;
    --seal-glow: rgba(185, 28, 28, 0.45);
    --brass: #d97706;
    --brass-light: #fef08a;
    --brass-dark: #854d0e;
    --brass-glow: rgba(217, 119, 6, 0.35);
    --bosph: #0e7490;
    --bosph-dark: #164e63;
    --bosph-light: #38bdf8;
    --torch: #f59e0b;
    --ok: #15803d;
    --ok-light: #22c55e;
    --bad: #991b1b;
    --top-h: 60px;
    --font-display: 'Cinzel Decorative', 'Cinzel', 'Hisar Stencil', 'Palatino Linotype', Georgia, serif;
    --font-heading: 'Cinzel', 'Cinzel Decorative', 'Hisar Stencil', 'Palatino Linotype', Georgia, serif;
    --font-serif: 'EB Garamond', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    --font-num: 'Cinzel', 'Hisar Stencil', 'Palatino Linotype', Georgia, serif;
    --serif: var(--font-serif);
    --stencil: var(--font-num);
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .25  0 0 0 0 .1  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.42'/></svg>");
    --compass: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100' fill='none' stroke='%23543f2c' stroke-opacity='.28' stroke-width='.7'><circle r='44'/><circle r='40' stroke-dasharray='1.5 2.5'/><circle r='13'/><path d='M0-46L6-6 46 0 6 6 0 46-6 6-46 0-6-6Z' fill='%23543f2c' fill-opacity='.1'/><path d='M0-30L3-3 30 0 3 3 0 30-3 3-30 0-3-3Z' transform='rotate(45)'/></svg>");
    --seljuk: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%238f6c38' stroke-width='0.7' stroke-opacity='0.25'><path d='M12 2l2.5 3.5 4-1.5.5 4.5 4.5.5-1.5 4L22 12l-3.5 2.5 1.5 4-4.5.5-.5 4.5-4-1.5L12 22l-2.5-3.5-4 1.5-.5-4.5-4.5-.5 1.5-4L2 12l3.5-2.5-1.5-4 4.5-.5.5-4.5 4 1.5L12 2z'/></svg>");
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: var(--font-serif);
    color: var(--ink);
    background: linear-gradient(180deg, #5b8db8 0%, #9cbacf 28%, #d4d7c8 55%, #dfe0d2 100%);
    user-select: none; -webkit-user-select: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  
  /* War table parchment panels with double-ruled brass & ink borders */
  .parch {
    background:
      radial-gradient(ellipse at 50% 25%, rgba(255, 252, 242, 0.7), rgba(255, 252, 242, 0) 75%),
      var(--grain),
      linear-gradient(180deg, var(--parch), var(--parch-2));
    border: 1.5px solid var(--edge);
    border-radius: 6px;
    color: var(--ink);
    box-shadow:
      inset 0 0 0 2px rgba(245, 236, 214, 0.9),
      inset 0 0 0 3px var(--rule),
      inset 0 0 28px rgba(120, 80, 30, 0.25),
      0 10px 28px rgba(18, 21, 27, 0.45),
      0 2px 6px rgba(0, 0, 0, 0.2);
  }
  .num {
    font-family: var(--font-num);
    font-weight: 700;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  
  /* Molded antique brass buttons with tactile physical press */
  button {
    font-family: var(--font-heading);
    color: var(--ink);
    cursor: pointer;
    border: 1.5px solid #8f6c38;
    border-radius: 5px;
    padding: 7px 13px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    background: linear-gradient(180deg, #fefbf2 0%, #eedebc 60%, #e2cd9e 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.85),
      inset 0 -1px 0 rgba(100, 70, 35, 0.2),
      0 3px 6px rgba(25, 18, 10, 0.3);
    transition: transform 0.08s ease, background 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    min-width: 44px;
  }
  button:hover:not(:disabled) {
    background: linear-gradient(180deg, #ffffff 0%, #f6e8cc 60%, #ead7ad 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      0 4px 10px rgba(217, 119, 6, 0.25),
      0 2px 4px rgba(25, 18, 10, 0.25);
    border-color: #b45309;
    transform: translateY(-1px);
  }
  button:active:not(:disabled) {
    transform: translateY(1.5px);
    box-shadow:
      inset 0 1px 2px rgba(50, 30, 15, 0.35),
      0 1px 2px rgba(25, 18, 10, 0.2);
  }
  button:disabled {
    opacity: 0.52;
    cursor: not-allowed;
    filter: grayscale(0.65);
    box-shadow: none;
    transform: none;
  }
  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 3px solid var(--bosph-light);
    outline-offset: 2px;
  }
  
  /* Imperial Ottoman Wax Seal CTA button */
  .primary {
    color: #fff9ed;
    border: 2px solid var(--seal-dark);
    text-shadow: 0 1px 2px rgba(45, 5, 5, 0.8);
    letter-spacing: 0.04em;
    font-family: var(--font-heading);
    font-weight: 700;
    border-radius: 18px 14px 20px 15px / 15px 20px 14px 18px;
    background: radial-gradient(120% 150% at 28% 18%, #e2594a 0%, var(--seal) 45%, #7f1212 100%);
    box-shadow:
      inset 0 2px 1px rgba(255, 215, 195, 0.45),
      inset 0 -3px 2px rgba(50, 0, 0, 0.45),
      inset 0 0 0 2px rgba(110, 15, 15, 0.35),
      0 4px 12px rgba(60, 10, 10, 0.45);
  }
  .primary:hover:not(:disabled) {
    background: radial-gradient(120% 150% at 28% 18%, #f06a5a 0%, #c82424 45%, #8c1515 100%);
    box-shadow:
      inset 0 2px 1px rgba(255, 230, 215, 0.6),
      inset 0 -3px 2px rgba(50, 0, 0, 0.45),
      0 6px 16px var(--seal-glow),
      0 2px 5px rgba(60, 10, 10, 0.4);
    transform: translateY(-1px);
  }
  .primary:active:not(:disabled) {
    transform: translateY(1.5px);
    box-shadow:
      inset 0 2px 3px rgba(40, 0, 0, 0.6),
      0 1px 3px rgba(60, 10, 10, 0.3);
  }

  /* Modular Command HUD Bar */
  #top {
    position: fixed;
    top: 10px;
    left: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 5;
    pointer-events: none;
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
  }
  .hud-brand, .hud-resources, .hud-controls {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hud-brand {
    padding: 5px 12px 5px 10px;
  }
  #top .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 1.5px;
    color: var(--ink);
    white-space: nowrap;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  #top .logo img { width: 30px; height: 30px; margin: -2px 0; object-fit: contain; }
  #top .logo small {
    font-family: var(--font-serif);
    font-weight: 500;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    margin-left: 2px;
  }
  .hud-resources {
    padding: 4px 8px;
    background: var(--grain), linear-gradient(180deg, rgba(245, 236, 214, 0.94), rgba(226, 209, 170, 0.94));
    border: 1.5px solid var(--edge);
    border-radius: 6px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.85),
      inset 0 0 16px rgba(120, 80, 30, 0.2),
      0 6px 18px rgba(18, 21, 27, 0.35);
  }
  .stat {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 4px;
    background: rgba(255, 252, 242, 0.7);
    border: 1px solid var(--rule);
    font-family: var(--font-num);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    box-shadow: inset 0 -2px 0 rgba(84, 63, 44, 0.1);
  }
  .stat#sGold { border-color: rgba(217, 119, 6, 0.4); color: #854d0e; }
  .stat#sLives { border-color: rgba(185, 28, 28, 0.35); color: #991b1b; }
  .stat#sWave { border-color: rgba(14, 116, 144, 0.35); color: #164e63; }
  .stat small.unit { font-size: 10px; letter-spacing: 0.1em; color: var(--ink-soft); font-family: var(--font-heading); margin-left: 1px; }
  .ic { width: 1.35em; height: 1.35em; vertical-align: -0.26em; display: inline-block; object-fit: contain; }
  .ic.big { width: 36px; height: 36px; vertical-align: middle; }
  button .ic { pointer-events: none; }
  .gl { width: 15px; height: 15px; vertical-align: -2px; fill: currentColor; }
  .hud-controls {
    padding: 3px;
    gap: 6px;
  }
  #top button { min-width: 44px; min-height: 44px; padding: 6px 10px; }
  #bSpeed { font-family: var(--font-num); font-size: 16px; min-width: 46px; }
  #bWall.on { background: linear-gradient(180deg, #fde68a, #f59e0b); box-shadow: inset 0 2px 4px rgba(84, 63, 44, 0.45); }

  /* War Council Decree / Next Wave Panel */
  #wavebox {
    position: fixed;
    right: 12px;
    bottom: 12px;
    padding: 12px 14px 14px;
    z-index: 5;
    width: 270px;
    background:
      var(--seljuk) top 6px right 6px / 18px repeat-x,
      radial-gradient(ellipse at 50% 20%, rgba(255, 252, 242, 0.7), rgba(255, 252, 242, 0) 75%),
      var(--grain),
      linear-gradient(180deg, var(--parch), var(--parch-2));
    border: 1.5px solid var(--edge);
    border-radius: 6px;
    box-shadow:
      inset 0 0 0 2px rgba(245, 236, 214, 0.9),
      inset 0 0 0 3px var(--rule),
      inset 0 0 20px rgba(120, 80, 30, 0.25),
      0 12px 32px rgba(18, 21, 27, 0.55),
      0 2px 6px rgba(0, 0, 0, 0.3);
  }
  #wavebox .lbl {
    font-family: var(--font-heading);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #wavePreview {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 11px;
    min-height: 32px;
  }
  #wavePreview span {
    background: rgba(255, 252, 242, 0.75);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 3px 8px;
    font-family: var(--font-num);
    font-size: 15px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 1px 2px rgba(40, 30, 20, 0.15);
  }
  #bWave {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    letter-spacing: 0.05em;
    min-height: 48px;
  }
  #bWave.pulse { animation: sealPulse 1.6s infinite ease-in-out; }
  @keyframes sealPulse {
    0%, 100% {
      box-shadow:
        inset 0 2px 1px rgba(255, 215, 195, 0.45),
        inset 0 -3px 2px rgba(50, 0, 0, 0.45),
        0 4px 12px rgba(60, 10, 10, 0.45);
    }
    50% {
      box-shadow:
        inset 0 2px 1px rgba(255, 230, 215, 0.65),
        inset 0 -3px 2px rgba(50, 0, 0, 0.45),
        0 0 0 6px rgba(185, 28, 28, 0.3),
        0 6px 20px rgba(185, 28, 28, 0.55);
    }
  }
  @media (prefers-reduced-motion: reduce) { #bWave.pulse, .ocard .newbest, #panel { animation: none; } }
  html[data-arena-reduced-motion] :is(#bWave.pulse, .ocard .newbest, #panel) { animation: none; } /* the same from the Arena panel */
  .card .closed { flex-basis: 100%; font-size: 12px; font-weight: 700; color: #991b1b; }

  /* Architect's Workshop / Build & Upgrade Panel */
  #panel {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    padding: 14px 16px;
    z-index: 6;
    width: min(600px, calc(100% - 310px));
  }
  #panel.hidden { display: none; }
  .ph {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    letter-spacing: 0.06em;
  }
  .ph .x { padding: 4px 10px; min-height: 36px; min-width: 36px; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    text-align: left;
    padding: 10px 8px;
    position: relative;
    border-radius: 5px;
    border: 1.5px solid #8f6c38;
  }
  .card .ico { display: block; height: 38px; }
  .card b { font-family: var(--font-heading); font-size: 14px; letter-spacing: 0.02em; }
  .card small {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.35;
  }
  .card .cost {
    margin-top: 3px;
    font-family: var(--font-num);
    font-size: 16px;
    color: #854d0e;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .card kbd {
    position: absolute;
    top: 6px;
    right: 7px;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    font-family: var(--font-num);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 1px 5px;
    background: rgba(255, 252, 242, 0.7);
  }
  .tw { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start; }
  .tstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 16px; font-size: 14px; }
  .tstats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--rule); padding-bottom: 2px; }
  .tstats b { font-family: var(--font-num); font-size: 16px; font-variant-numeric: tabular-nums; }
  .tstats .up { color: var(--ok); font-weight: 700; }
  .tbtns { display: flex; flex-direction: column; gap: 7px; min-width: 170px; }
  .tbtns-sub { display: flex; flex-direction: column; gap: 7px; }
  .sheet-handle { display: none; }
  .lvl { display: inline-flex; gap: 4px; margin-left: 9px; vertical-align: 1px; }
  .lvl i { width: 11px; height: 11px; border-radius: 50%; background: rgba(84, 63, 44, 0.22); display: inline-block; border: 1px solid var(--rule); }
  .lvl i.on {
    background: radial-gradient(circle at 35% 30%, #f87171, var(--seal) 60%, #7f1212);
    border-color: var(--seal-dark);
    box-shadow: 0 0 6px var(--seal-glow);
  }

  /* Toasts, Boss Siege Bar & Banners */
  #toast {
    position: fixed;
    top: calc(var(--top-h) + 16px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: max-content;
    max-width: calc(100% - 32px);
  }
  #toast div {
    background: var(--grain), linear-gradient(180deg, #fefbf2, #eedebc);
    color: var(--ink);
    padding: 8px 18px 8px 16px;
    border-radius: 3px;
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 14px;
    animation: tin .25s ease-out;
    box-shadow: 0 6px 18px rgba(18, 21, 27, 0.4);
    border: 1.5px solid var(--edge);
    border-left: 5px solid var(--ink-soft);
    text-align: center;
  }
  #toast div.good { border-left-color: var(--ok); }
  #toast div.bad { border-left-color: var(--seal); color: #7f1212; }
  #toast div.shield-hint {
    border-left: 5px solid #0284c7;
    border-color: var(--edge);
    background: var(--grain), linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 60%, #bae6fd 100%);
    color: #0c4a6e;
    font-size: 13.5px;
    line-height: 1.35;
    padding: 8px 16px 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    box-shadow: 0 6px 20px rgba(12, 74, 110, 0.35), 0 2px 6px rgba(0, 0, 0, 0.2);
  }
  #toast div.shield-hint .ic {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  #banner {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    z-index: 6;
    pointer-events: none;
    text-align: center;
    display: none;
  }
  #banner.on { display: block; animation: bannerIn 1.8s ease both; }
  #banner b {
    display: block;
    font-family: var(--font-display);
    font-size: 58px;
    letter-spacing: 4px;
    color: #fff9ed;
    text-shadow:
      0 3px 0 #2a1a0a,
      0 0 3px #2a1a0a,
      0 0 24px rgba(0, 0, 0, 0.55);
  }
  #banner.boss b {
    color: #fee2e2;
    text-shadow:
      0 3px 0 #450a0a,
      0 0 4px #450a0a,
      0 0 26px rgba(185, 28, 28, 0.7);
  }
  #banner span {
    display: inline-flex;
    gap: 12px;
    margin-top: 8px;
    padding: 6px 16px;
    border-radius: 4px;
    color: var(--ink);
    font-family: var(--font-num);
    font-size: 18px;
    font-weight: 700;
    background: var(--grain), linear-gradient(180deg, #fefbf2, #eedebc);
    border: 1.5px solid var(--edge);
    box-shadow: 0 6px 18px rgba(18, 21, 27, 0.45);
  }
  #banner .ic { width: 26px; height: 26px; }
  @keyframes bannerIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.85); }
    15%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
  }
  #boss {
    position: fixed;
    left: 50%;
    top: calc(var(--top-h) + 12px);
    transform: translateX(-50%);
    z-index: 5;
    width: min(420px, calc(100% - 32px));
    padding: 8px 14px 10px;
    display: none;
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #boss.on { display: block; animation: bossRumble 0.4s ease-out; }
  @keyframes bossRumble {
    0% { transform: translate(-50%, -10px); opacity: 0; }
    100% { transform: translate(-50%, 0); opacity: 1; }
  }

function mergeScenery(parts) {
  if (!parts || !parts.length) return new THREE.BufferGeometry();
  let totalVerts = 0;
  for (let i = 0; i < parts.length; i++) {
    const src = parts[i];
    if (!src || !src.attributes || !src.attributes.position) continue;
    totalVerts += src.index ? src.index.count : src.attributes.position.count;
  }
  if (!totalVerts) return new THREE.BufferGeometry();
  const allPos = new Float32Array(totalVerts * 3);
  const allNorm = new Float32Array(totalVerts * 3);
  const allCol = new Float32Array(totalVerts * 3);
  let vOffset = 0;
  for (let p = 0; p < parts.length; p++) {
    const src = parts[p];
    if (!src || !src.attributes || !src.attributes.position) continue;
    const pos = src.attributes.position;
    if (!src.attributes.normal) src.computeVertexNormals();
    const norm = src.attributes.normal;
    const col = src.attributes.color;
    const idx = src.index;
    if (idx) {
      const idxCount = idx.count;

        const vi = idx.getX(j);
        const o3 = vOffset * 3;
        allPos[o3] = pos.getX(vi); allPos[o3 + 1] = pos.getY(vi); allPos[o3 + 2] = pos.getZ(vi);
        if (norm) { allNorm[o3] = norm.getX(vi); allNorm[o3 + 1] = norm.getY(vi); allNorm[o3 + 2] = norm.getZ(vi); }
        else { allNorm[o3 + 1] = 1; }
        if (col) { allCol[o3] = col.getX(vi); allCol[o3 + 1] = col.getY(vi); allCol[o3 + 2] = col.getZ(vi); }
        else { allCol[o3] = 1; allCol[o3 + 1] = 1; allCol[o3 + 2] = 1; }
        vOffset++;
      }
    } else {
      const pCount = pos.count;
      for (let vi = 0; vi < pCount; vi++) {
        const o3 = vOffset * 3;
        allPos[o3] = pos.getX(vi); allPos[o3 + 1] = pos.getY(vi); allPos[o3 + 2] = pos.getZ(vi);
        if (norm) { allNorm[o3] = norm.getX(vi); allNorm[o3 + 1] = norm.getY(vi); allNorm[o3 + 2] = norm.getZ(vi); }
        else { allNorm[o3 + 1] = 1; }
        if (col) { allCol[o3] = col.getX(vi); allCol[o3 + 1] = col.getY(vi); allCol[o3 + 2] = col.getZ(vi); }

function hpMul(w) { const k = w - 1; return 1 + 0.18 * k + 0.022 * k * k; }

// ---------------------------------------------------------------- simulation
function update(dt) {
  // spawning
  if (G.queue.length) {
    G.waveTime += dt;
    while (G.queue.length && G.queue[0].t <= G.waveTime) { const s = G.queue.shift(); spawn(s.type, s.path); }
  }
  // enemies
  for (const e of G.enemies) {
    if (!e.alive) continue;
    if (e.slowT > 0) e.slowT -= dt; else e.slowF = 1;
    if (e.dotT > 0) { e.dotT -= dt; damage(e, e.dotDps * dt, e.dotTower, 'dot'); if (!e.alive) continue; }
    if (e.flash > 0) e.flash -= dt;
    if (e.blockedCd > 0) e.blockedCd -= dt;
    e.d += e.speed * (e.slowT > 0 ? e.slowF : 1) * dt;
    e.bob += dt * e.speed * 3;
    if (e.d >= e.path.len) { reachEnd(e); if (G.over) return; continue; }
    placeEnemy(e);
  }
  // towers
  for (const tw of G.towers) {
    tw.cd -= dt;
    if (tw.recoil > 0) tw.recoil = Math.max(0, tw.recoil - dt * 4);
    const e = findTarget(tw);
    if (e) {
      const want = Math.atan2(e.x - tw.pad.x, e.z - tw.pad.z);
      let d = want - tw.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
      tw.yaw += d * Math.min(1, dt * 10);
      if (tw.cd <= 0) { fire(tw, e); tw.cd = stat(tw, 'rate'); }
    }
  }
  // arrows: fast homing shots
  for (const a of arrows.items) {
    if (a.e.alive) { a.tx = a.e.x; a.tz = a.e.z; }
    const dx = a.tx - a.x, dy = 0.9 - a.y, dz = a.tz - a.z, dist = Math.hypot(dx, dy, dz), step = 32 * dt;
    a.life -= dt;
    if (dist <= step + 0.3) {
      if (a.e.alive) {
        damage(a.e, a.dmg, a.tw, 'arrow');
        emit(a.tx, 0.9, a.tz, 3, 0xf1e3c4, 1.5, 0.3);
        if (a.e.type === 'shield') {
          emit(a.tx, 1.1, a.tz, 6, 0x93c5fd, 3.0, 0.35);
          sfx('deflect');
        } else {
          sfx('hit');
        }
      }
      a.life = 0;
    } else { a.x += dx / dist * step; a.y += dy / dist * step; a.z += dz / dist * step; a.dx = dx / dist; a.dy = dy / dist; a.dz = dz / dist; }
  }
  arrows.items = arrows.items.filter(a => a.life > 0);
  // cannonballs and tar: ballistic arcs with splash on landing
  for (const list of [balls, tars]) {
    for (const b of list.items) {
      b.t += dt;
      if (b.t >= b.T) {
        b.done = true;
        const tw = b.tw, r = stat(tw, 'splash');
        for (const e of G.enemies) {
          if (!e.alive) continue;
          const d = Math.hypot(e.x - b.x1, e.z - b.z1);
          if (d > r) continue;
          if (list === balls) damage(e, stat(tw, 'dmg') * (1 - 0.45 * d / r), tw, 'ball');
          else {
            e.dotDps = Math.max(e.dotT > 0 ? e.dotDps : 0, stat(tw, 'dps'));
            e.dotT = 3; e.dotTower = tw;
            e.slowT = 2.6; e.slowF = Math.min(e.slowF, stat(tw, 'slow'));
          }
        }
        if (list === balls) { emit(b.x1, 0.4, b.z1, 22, 0x9b8a6e, 5, 0.6); emit(b.x1, 0.4, b.z1, 8, 0xffb347, 3, 0.35); FX.blast(b.x1, b.z1); if (!G.reduced) shake = Math.max(shake, 0.18); sfx('impact'); }
        else {
          emit(b.x1, 0.3, b.z1, 14, 0x2a1a0e, 3, 0.5);
          FX.tar(b.x1, b.z1);
          if (puddles.items.length < 40) puddles.items.push({ x: b.x1, z: b.z1, r, life: 3, max: 3, slow: stat(tw, 'slow') });
          sfx('splash');
        }
      }
    }
    list.items = list.items.filter(b => !b.done);
  }
  // tar puddles keep slowing whoever walks through them
  for (const p of puddles.items) {
    p.life -= dt;
    for (const e of G.enemies) if (e.alive && Math.hypot(e.x - p.x, e.z - p.z) < p.r) { e.slowT = Math.max(e.slowT, 0.3); e.slowF = Math.min(e.slowF, p.slow); }
  }
  puddles.items = puddles.items.filter(p => p.life > 0);
  // cleanup + wave end
  if (G.enemies.some(e => !e.alive)) G.enemies = G.enemies.filter(e => e.alive);
  if (G.phase === 'wave' && !G.queue.length && !G.enemies.length) {
    G.phase = 'build';
    const b = G.pendingBonus; G.pendingBonus = 0;
    addGold(b);
    toast(t('cleared', { n: b }), 'good');
    // the record counts as soon as the wave is cleared, even if the run is never finished
    if (!G.daily) { // a daily challenge (one tower type closed) does not count towards the best
      if (G.best0 > 0 && G.wave === G.best0 + 1) toast(t('newBest'), 'good');
      saveBest(G.wave);
    }
    sfx('clear');
    setBattleMusic(false);
    if (G.wave >= MAX_WAVES && !G.endless) endGame(true);
    else saveRun();
    updateHUD();
  }
}

document.addEventListener('click', ev => { if (ev.detail > 0 && ev.target.closest?.('#top, #wavebox, #panel')) document.activeElement?.blur?.(); });
window.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === 'Tab' && screen) { // trap focus inside the open overlay card (.ocard)
    const els = [...ocard.querySelectorAll('button:not(:disabled), input:not(:disabled), [href]')];
    if (els.length) {
      const i = els.indexOf(document.activeElement);
      ev.preventDefault();
      els[ev.shiftKey ? (i <= 0 ? els.length - 1 : i - 1) : (i < 0 || i >= els.length - 1 ? 0 : i + 1)].focus();
    }
    return;
  }
  if (ev.repeat) return;
  const k = ev.key.toLowerCase(), focused = document.activeElement?.tagName;
  if (focused === 'INPUT' && k !== 'escape') return; // sliders keep the arrow keys
  // Esc goes back one step: guide, settings, then the pad panel, then pause; P always pauses or resumes
  if (k === 'escape') {
    if (screen === 'guide') showScreen(guideFrom === 'pause' && G.running && !G.over ? 'pause' : 'title');
    else if (screen === 'settings') settingsBack();
    else if (wallMode && !G.paused) setWallMode(false);
    else if (sel && !G.paused) closePanel();
    else if (G.running && !G.over) setPaused(!G.paused);
    return;
  }
  if (k === 'p') {
    if (screen === 'guide') showScreen(guideFrom === 'pause' && G.running && !G.over ? 'pause' : 'title');
    else if (screen === 'settings' && settingsFrom === 'pause') settingsBack();
    else if (G.running && !G.over) setPaused(!G.paused);

  if (k === 'm') { toggleMusic(); return; }
  if (k === 'x') { toggleSfx(); return; }
  if (k === 'l') { toggleLang(); return; }
  if (screen) return; // an overlay card is open: no gameplay keys
  if (k === ' ') {

    ev.preventDefault(); initAudio(); startWave();
  }
  else if (k === 'f') $('bSpeed').click();
  else if (k === 'b') { initAudio(); if (!G.paused) setWallMode(!wallMode); }
  else if (sel && !sel.tower && ['1', '2', '3'].includes(k)) { if (buildTower(sel.pad, TOWER_KEYS[+k - 1])) showTower(sel.pad.tower); }
  else if (sel?.tower && k === 'u') upgradeTower(sel.tower);

});

// ---------------------------------------------------------------- quality
function applyQuality() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, low ? 1 : 1.5));
  renderer.setSize(innerWidth, innerHeight);
  arenaPerfAttach();
  if (renderer.shadowMap.enabled === low) {
    renderer.shadowMap.enabled = sun.castShadow = !low;
    scene.traverse(o => { if (o.material) for (const m of [].concat(o.material)) m.needsUpdate = true; }); // recompile with / without shadows
  }
  if (typeof sceneryMesh !== 'undefined' && sceneryMesh) {
    sceneryMesh.geometry = low ? sceneryGeoLow : sceneryGeoHigh;
    sceneryMesh.castShadow = !low;
  }
  for (const [m, full, part] of lodMeshes) m.count = low ? Math.min(part, full) : full;
  updatePuffScale();
}

// ---------------------------------------------------------------- audio (all synthesised)
// master -> destination; sfx and music each have their own gain, so the settings sliders and the M / X keys work separately
let ac = null, master = null, sfxBus = null, musicBus = null, drumsGain = null, noiseBuf = null, musicStarted = false, drumsOn = false;
if (AUTO) settings.master = 0; // shows the muted icon for the silent bot (never saved: the store is read-only under ?auto)
function initAudio() {
  if (AUTO) return; // the bot plays silently

  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.connect(master);
    drumsGain = ac.createGain(); drumsGain.gain.value = drumsOn ? 0.71 : 0.0001; drumsGain.connect(musicBus);
    applyVolumes();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setTimeout(startMusic, 30); // render the loop just after the click, so the click itself stays instant
  } catch (e) { ac = null; }
}

  master.gain.value = 0.4 * settings.master; // 0.32 at the default 0.8, the level from before the overnight pass
  sfxBus.gain.value = settings.sfxOn ? settings.sfx / 0.8 : 0;
  musicBus.gain.value = settings.musicOn ? settings.music / 2.4 : 0; // the same music / effects balance as the Godot version
}
function tone(f, dur, type = 'sine', vol = 0.3, f2 = null, delay = 0) {
  const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(sfxBus); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, freq, type = 'lowpass', delay = 0, q = 1) {
  const t0 = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f).connect(g).connect(sfxBus); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
}
const lastSfx = {};
function sfx(name) {
  if (!ac || ac.state !== 'running' || master.gain.value < 0.001 || sfxBus.gain.value < 0.001) return;
  const now = ac.currentTime, gap = { bow: 0.06, hit: 0.05, coin: 0.07, boom: 0.08, impact: 0.08, lob: 0.1, splash: 0.1, deflect: 0.06 }[name] ?? 0.03;
  if (lastSfx[name] && now - lastSfx[name] < gap) return;
  lastSfx[name] = now;
  switch (name) {
    case 'bow': noise(0.08, 0.12, 2800, 'bandpass', 0, 2); tone(420, 0.07, 'triangle', 0.05, 180); break;
    case 'hit': noise(0.05, 0.08, 1200, 'bandpass', 0, 3); break;
    case 'deflect': noise(0.05, 0.1, 2600, 'bandpass', 0, 3); tone(780, 0.06, 'triangle', 0.07, 390); break;
    case 'boom': noise(0.4, 0.5, 420); tone(110, 0.35, 'sine', 0.4, 40); break;
    case 'impact': noise(0.3, 0.3, 700); tone(80, 0.25, 'sine', 0.25, 35); break;
    case 'lob': tone(260, 0.16, 'triangle', 0.08, 140); break;
    case 'splash': noise(0.22, 0.18, 500, 'lowpass', 0, 4); break;
    case 'coin': tone(1320, 0.06, 'square', 0.04); tone(1760, 0.09, 'square', 0.04, null, 0.05); break;
    case 'build': noise(0.15, 0.2, 300); tone(196, 0.12, 'triangle', 0.15, null, 0.02); tone(294, 0.15, 'triangle', 0.12, null, 0.1); break;
    case 'upgrade': noise(0.12, 0.15, 400); [392, 523, 659].forEach((f, i) => tone(f, 0.2, 'triangle', 0.12, null, 0.05 + i * 0.08)); break;
    case 'click': tone(660, 0.04, 'triangle', 0.06); break;
    case 'deny': tone(180, 0.15, 'square', 0.06, 140); break;
    case 'hurt': noise(0.35, 0.35, 260); tone(150, 0.3, 'sawtooth', 0.12, 70); break;
    case 'horn': [146.8, 220, 293.7].forEach((f, i) => tone(f, 0.9, 'sawtooth', 0.06, f * 0.98, i * 0.03)); break;
    case 'boss': tone(98, 1.5, 'sawtooth', 0.08, 92); tone(147, 1.5, 'sawtooth', 0.06, 140); tone(196, 1.2, 'sawtooth', 0.05, 190, 0.25); break;
    case 'clear': [523, 659, 784].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, null, i * 0.1)); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.5, 'triangle', 0.12, null, i * 0.16)); break;
    case 'lose': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.5, 'sawtooth', 0.07, null, i * 0.22)); break;
  }
}

// Music, ported from the Godot version: a two-stem loop in 9/8 (2+2+2+3) in the Hicaz mode. The calm stem (drone, saz-like
// plucked melody, bass) always plays; the drum stem (düm / tek / zil) fades in while a wave is running.
const MUSIC_RATE = 22050, EIGHTH = 0.2, D4 = 293.66;
const MELODY = [ // [start eighth, length in eighths, semitones from D4], 8 bars
  [0, 2, 7], [2, 2, 8], [4, 2, 7], [6, 3, 5], [9, 2, 4], [11, 2, 5], [13, 1, 4], [14, 1, 1], [15, 3, 0],
  [18, 2, 0], [20, 2, 1], [22, 2, 4], [24, 3, 5], [27, 2, 7], [29, 2, 5], [31, 2, 4], [33, 3, 7],
  [36, 2, 12], [38, 2, 10], [40, 2, 8], [42, 3, 7], [45, 2, 8], [47, 2, 7], [49, 2, 5], [51, 3, 4],
  [54, 2, 5], [56, 2, 4], [58, 2, 1], [60, 3, 4], [63, 2, 1], [65, 2, 0], [67, 5, 0],
];
const BASS = [0, 0, -5, 0, 5, 1, -2, 0];
async function renderMusic() {
  const breathe = () => new Promise(r => setTimeout(r, 0)); // render in slices so the game keeps running smoothly
  let s = 1453; // own random stream, so the music never shifts the game's seeded one
  const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  const R = MUSIC_RATE, len = 8 * 9 * EIGHTH, N = Math.floor(len * R);
  const calm = new Float32Array(N), drums = new Float32Array(N);
  const wave = (k, p) => { p -= Math.floor(p); return k === 'triangle' ? 4 * Math.abs(p - 0.5) - 1 : Math.sin(p * Math.PI * 2); };
  const toneInto = (b, start, dur, f0, f1, kind, vol) => {
    const i0 = Math.floor(start * R), n = Math.floor(dur * R), ratio = f1 > 0 ? f1 / f0 : 1, fall = Math.log(0.0001 / Math.max(vol, 0.0002));
    let ph = 0;
    for (let i = 0; i < n && i0 + i < N; i++) {
      const tt = i / R; ph += f0 * Math.pow(ratio, tt / dur) / R;
      b[i0 + i] += wave(kind, ph) * (tt < 0.01 ? vol * tt / 0.01 : vol * Math.exp(fall * (tt - 0.01) / Math.max(0.001, dur - 0.01)));
    }
  };
  const noiseInto = (b, start, dur, vol, freq, mode, q) => { // RBJ biquad over white noise
    const w0 = 2 * Math.PI * freq / R, al = Math.sin(w0) / (2 * q), cw = Math.cos(w0), a0 = 1 + al;
    const [b0, b1, b2] = mode === 'bandpass' ? [al, 0, -al] : [(1 - cw) / 2, 1 - cw, (1 - cw) / 2];
    const a1 = -2 * cw / a0, a2 = (1 - al) / a0, fall = Math.log(0.0001 / Math.max(vol, 0.0002));
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    const i0 = Math.floor(start * R), n = Math.floor(dur * R);
    for (let i = 0; i < n && i0 + i < N; i++) {
      const x = rnd() * 2 - 1, y = (b0 * x + b1 * x1 + b2 * x2) / a0 - a1 * y1 - a2 * y2;
      x2 = x1; x1 = x; y2 = y1; y1 = y;
      b[i0 + i] += y * vol * Math.exp(fall * (i / R) / dur);
    }
  };
  const pluck = (b, start, dur, f, vol, damp) => { // Karplus-Strong string
    const period = Math.max(2, Math.floor(R / f)), ring = new Float32Array(period);
    for (let i = 0; i < period; i++) ring[i] = rnd() * 2 - 1;
    const i0 = Math.floor(start * R), n = Math.floor(dur * R), tail = Math.floor(0.04 * R);
    let pos = 0;
    for (let i = 0; i < n && i0 + i < N; i++) {
      const nx = (pos + 1) % period, out = ring[pos];
      ring[pos] = damp * 0.5 * (ring[pos] + ring[nx]); pos = nx;
      b[i0 + i] += out * vol * (i < n - tail ? 1 : (n - i) / tail);
    }
  };
  const normalize = (b, peak) => { let m = 0.0001; for (const v of b) m = Math.max(m, Math.abs(v)); const k = peak / m; for (let i = 0; i < b.length; i++) b[i] *= k; };
  // drone: D3 + A3 from a small harmonic wavetable with a slow swell
  const table = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const p = i / 1024 * Math.PI * 2; table[i] = Math.sin(p) + 0.45 * Math.sin(2 * p) + 0.22 * Math.sin(3 * p) + 0.1 * Math.sin(4 * p); }
  let p1 = 0, p2 = 0;
  for (let i = 0; i < N; i++) {
    if (i % 65536 === 0) await breathe();
    const tt = i / R, swell = 0.75 + 0.25 * Math.sin(tt * Math.PI * 2 / (len / 2));
    p1 += 146.83 * (1 + 0.002 * Math.sin(tt * 5)) / R; p2 += 220 / R;
    calm[i] = (table[((p1 - Math.floor(p1)) * 1023) | 0] * 0.05 + table[((p2 - Math.floor(p2)) * 1023) | 0] * 0.025) * swell;
  }
  await breathe();
  for (const [st, ln, semi] of MELODY) {
    const f = D4 * Math.pow(2, semi / 12);
    pluck(calm, st * EIGHTH, ln * EIGHTH + 0.35, f, 0.32, 0.9965);
    pluck(calm, st * EIGHTH + 0.012, ln * EIGHTH + 0.2, f * 2, 0.07, 0.993);
  }
  BASS.forEach((semi, bar) => {
    const f = D4 * 0.25 * Math.pow(2, semi / 12);
    pluck(calm, bar * 9 * EIGHTH, 9 * EIGHTH, f, 0.4, 0.998);
    pluck(calm, (bar * 9 + 6) * EIGHTH, 3 * EIGHTH, f * 1.5, 0.18, 0.997);
  });
  normalize(calm, 0.7);
  for (let bar = 0; bar < 8; bar++) {
    await breathe();
    const o = bar * 9 * EIGHTH;
    for (const e of [0, 4]) { toneInto(drums, o + e * EIGHTH, 0.32, 95, 48, 'sine', 0.7); noiseInto(drums, o + e * EIGHTH, 0.08, 0.25, 180, 'lowpass', 1); } // düm
    for (const e of [2, 6, 7, 8]) { noiseInto(drums, o + e * EIGHTH, 0.06, e !== 8 ? 0.32 : 0.18, 3200, 'bandpass', 2.5); toneInto(drums, o + e * EIGHTH, 0.05, 640, 520, 'triangle', 0.08); } // tek
    if (bar % 2 === 1) noiseInto(drums, o + 8 * EIGHTH, 0.5, 0.12, 7000, 'bandpass', 1.2); // zil
  }
  normalize(drums, 0.65);
  return [calm, drums];
}
async function startMusic() {
  if (!ac || musicStarted) return;
  musicStarted = true;
  const t0 = performance.now(), stems = await renderMusic(), at = ac.currentTime + 0.1;
  stems.forEach((data, i) => {
    const buf = ac.createBuffer(1, data.length, MUSIC_RATE);
    buf.copyToChannel(data, 0);
    const src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    src.connect(i ? drumsGain : musicBus);
    src.start(at);
  });
  if (DEBUG) console.log('[hisar] music rendered in', Math.round(performance.now() - t0), 'ms');
}
function setBattleMusic(on) {
  if (on === drumsOn) return;
  drumsOn = on;
  if (!drumsGain) return;
  const g = drumsGain.gain, now = ac.currentTime;
  g.cancelScheduledValues(now); g.setValueAtTime(Math.max(0.0001, g.value), now);
  g.exponentialRampToValueAtTime(on ? 0.71 : 0.0001, now + (on ? 1.5 : 3)); // -3 dB in a wave, silent between waves
}

// ---------------------------------------------------------------- autoplay bot (?auto) for self-testing
const autoPlan = ['archer', 'archer', 'cannon', 'tar', 'archer', 'cannon', 'archer', 'tar', 'cannon', 'archer'];
const autoPads = [...pads].sort((a, b) => Math.hypot(a.x - 12, a.z) - Math.hypot(b.x - 12, b.z));
let autoT = 0, autoBuildIdx = 0;
function autoplay(dt) {
  autoT -= dt;
  if (autoT > 0) return;
  autoT = 0.5;
  const free = autoPads.find(p => !p.tower);
  const type = autoPlan[autoBuildIdx % autoPlan.length];
  const upgr = G.towers.filter(tw => tw.level < 2).sort((a, b) => TOWERS[a.type].cost[a.level + 1] - TOWERS[b.type].cost[b.level + 1])[0];
  if (free && G.gold >= TOWERS[type].cost[0] && (G.towers.length < 8 || !upgr || G.gold > 260)) { buildTower(free, type); autoBuildIdx++; }
  else if (upgr && G.gold >= TOWERS[upgr.type].cost[upgr.level + 1]) upgradeTower(upgr);
  if (G.phase === 'build' && !G.over) startWave();
}

// ---------------------------------------------------------------- camera framing
// Portrait screens (phones) look along the roads from behind the fortress, so the roads run down the screen to the gate
// (the Godot version's portrait preset: yaw π/2, pitch 1.05, distance 60, target (-4, 0, 0)) and keep a 62° horizontal
// field of view so the whole width of the map fits.
const isPortrait = () => innerHeight > innerWidth;
function fitFov() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = isPortrait() ? 2 * Math.atan(Math.tan(31 * Math.PI / 180) / camera.aspect) * 180 / Math.PI : 42;
  camera.updateProjectionMatrix();
}
function cameraHome() {
  if (camParam) return;
  // (redesign: a little steeper and further west, so the taller hisar sits at the bottom edge instead of filling it)
  if (isPortrait()) { controls.target.set(-6, 0, 0); camera.position.set(-6 + Math.cos(1.12) * 63, Math.sin(1.12) * 63, 0); }
  // landscape keeps the view the title orbit ended on, as before
}
let wasPortrait = isPortrait();
function onResize() {
  fitFov();
  renderer.setSize(innerWidth, innerHeight);
  updatePuffScale();
  if (isPortrait() !== wasPortrait) { wasPortrait = isPortrait(); if (G.running) cameraHome(); }
}
addEventListener('resize', onResize);

// ---------------------------------------------------------------- loop
document.addEventListener('visibilitychange', () => { if (ac) { if (document.hidden) ac.suspend(); else ac.resume().catch(() => { /* needs a gesture */ }); } });
const clock = new THREE.Clock();
let time = 0, perfT = 0, hoverT = 0, fpsEma = 60;
const minT = new THREE.Vector3(-46, 0, -32), maxT = new THREE.Vector3(40, 0, 32), _targetBefore = new THREE.Vector3(); // scratch to avoid per-frame .clone()
const dbgEl = document.createElement('div');
if (DEBUG) { dbgEl.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:20;font:600 13px system-ui,sans-serif;background:#000a;color:#fff;padding:4px 8px;border-radius:6px;pointer-events:none'; document.body.appendChild(dbgEl); }
const camParam = params.get('cam');
function frame() {
  requestAnimationFrame(frame);
  const raw = clock.getDelta(), dt = Math.min(0.05, raw);
  time += dt;
  if (raw > 0) fpsEma += (1 / raw - fpsEma) * 0.05;
  const active = G.running && !G.over && !G.paused && !document.hidden;
  if (active) {
    if (AUTO) autoplay(dt * G.speed);
    let sim = dt * G.speed;
    while (sim > 1e-6 && !G.over) { const s = Math.min(0.025, sim); update(s); sim -= s; }
  }
  updateVisuals(active ? dt * G.speed : (G.paused ? 0 : dt), time);
  updateFloatText(dt);
  // hover highlight (throttled)
  hoverT -= dt;
  if (lastMove && hoverT <= 0 && G.running && !screen) {
    hoverT = 0.06;
    const p = pick(lastMove.x, lastMove.y), h = p ? p.i : -1;
    canvas.style.cursor = p || wallMode ? 'pointer' : '';
    if (wallMode) hoverWall(p ? -1 : groundCell(lastMove.x, lastMove.y));
    if (h !== hoverPad) { hoverPad = h; refreshPadColors(); }
  }
  // title screen: slow cinematic orbit (not when ?cam fixes the view)
  if (!G.running && !camParam) {
    const a = time * 0.05;
    camera.position.set(Math.sin(a) * 62 - 2, 40, Math.cos(a) * 62);
    controls.target.set(-2, 0, 0);
  }
  controls.update();
  _targetBefore.copy(controls.target);
  controls.target.clamp(minT, maxT);
  camera.position.add(_targetBefore.sub(controls.target).negate());
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 1.5);
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    camera.position.x += sx; camera.position.y += sy;
    renderer.render(scene, camera);
    camera.position.x -= sx; camera.position.y -= sy;
  } else renderer.render(scene, camera);
  if (DEBUG) dbgEl.textContent = `draw calls ${renderer.info.render.calls} · triangles ${renderer.info.render.triangles} · ${fpsEma.toFixed(0)} fps · errors ${G.errors.length}`;
  if (DEBUG && (perfT += dt) > 5) { perfT = 0; console.log('[hisar] draw calls', renderer.info.render.calls, 'tris', renderer.info.render.triangles, 'fps', fpsEma.toFixed(1)); }
}

// ?debug: fast-forward the simulation without rendering, for balance tests
if (DEBUG) window.hisarSim = (seconds, withBot = true) => {
  for (let s = 0; s < seconds && !G.over; s += 0.025) { if (withBot) autoplay(0.025); update(0.025); }
  return { wave: G.wave, lives: G.lives, gold: G.gold, towers: G.towers.map(tw => tw.type[0] + tw.level).join(' '), over: G.over, errors: G.errors.length };
};
// ?debug: select a pad by index (screenshots and UI tests); the renderer for checks from the console
if (DEBUG) window.hisarRenderer = renderer;
// ?debug: barricade hooks for the in-page path tests
if (DEBUG) window.hisarWalls = { cellOf, cellX, cellZ, place: c => placeWall(c), remove: c => removeWall(c), problem: c => wallProblem(c), mode: on => setWallMode(on),
  lens: () => routes.map(r => +r.len.toFixed(2)), routed: () => routes.map(r => !!r.routed), buildable: () => [...cellBuild.keys()].filter(c => cellBuild[c] && !cellWall[c]),
  roadCells: i => [...roadCore[i].entries()], count: () => wallCount,
  grid: () => { const F = flowField(cellWall); return { GNX, GNZ, GOAL, open: [...cellOpen], road: [...cellRoad], build: [...cellBuild], wall: [...cellWall], dist: [...F.dist].map(d => isFinite(d) ? Math.round(d) : -1) }; }, hover: c => { hoverCell = -2; hoverWall(c); }, routes: () => routes,
  project: c => { const v = new THREE.Vector3(cellX(c), groundAt(cellX(c), cellZ(c)), cellZ(c)).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; } };
if (DEBUG) window.hisarSelect = i => { selectPad(pads[i]); return sel ? (sel.tower ? 'tower' : 'build') : 'none'; };

applyQuality();
fitFov();
updatePuffScale();
refreshSoundBtn();
applyLang();
// the top bar wraps on phones, and its height also changes with the gold digits and the language, not only on resize
new ResizeObserver(() => document.documentElement.style.setProperty('--top-h', $('top').offsetHeight + 'px')).observe($('top'));
// ?auto starts right away (as before the remaster, so the bot's runs stay comparable); the models swap in when they arrive
if (AUTO) startGame(null); else showScreen('title');
// ?sim=<seconds> (with ?auto) fast-forwards before the first frame, ?cam=x,y,z,tx,tz sets the view: used for screenshots
const simSec = +params.get('sim') || 0;
if (AUTO && simSec) {
  for (let s = 0; s < simSec && !G.over; s += 0.025) { autoplay(0.025); update(0.025); }
  clearFloatText();
  $('toast').innerHTML = '';
  $('banner').classList.remove('on');
}
if (camParam) { const [x, y, z, tx, tz] = camParam.split(',').map(Number); camera.position.set(x, y, z); controls.target.set(tx || 0, 0, tz || 0); }
G.pads = pads.length;
G.assets = [];
frame();
// the title screen shows while the models load (Play stays disabled); after 15 s the game goes on with whatever has
// loaded, and a model that arrives later is still swapped in
const assetsLoaded = loadAssets().then(() => { if (assetState.done) applyAssets(); });
Promise.race([assetsLoaded, new Promise(r => setTimeout(r, 15000))]).then(() => {
  applyAssets();
  assetState.done = true;
  G.assetsReady = true;
  if (screen === 'title') showScreen('title');
});
</script>
</body>
</html>
