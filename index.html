// ---------------------------------------------------------------- simulation
function update(dt) {
  // spawning
  if (G.queue.length) {
    G.waveTime += dt;
    while (G.queue.length && G.queue[0].t <= G.waveTime) { const s = G.queue.shift(); spawn(s.type, s.path); }
  }
  // enemies
  for (const e of G.enemies) {
    if (!e.alive) continue;
    if (e.slowT > 0) e.slowT -= dt; else e.slowF = 1;
    if (e.dotT > 0) { e.dotT -= dt; damage(e, e.dotDps * dt, e.dotTower, 'dot'); if (!e.alive) continue; }
    if (e.flash > 0) e.flash -= dt;
    e.d += e.speed * (e.slowT > 0 ? e.slowF : 1) * dt;
    e.bob += dt * e.speed * 3;
    if (e.d >= e.path.len) { reachEnd(e); if (G.over) return; continue; }
    placeEnemy(e);
  }
  // towers
  for (const tw of G.towers) {
    tw.cd -= dt;
    if (tw.recoil > 0) tw.recoil = Math.max(0, tw.recoil - dt * 4);
    const e = findTarget(tw);
    if (e) {
      const want = Math.atan2(e.x - tw.pad.x, e.z - tw.pad.z);
      let d = want - tw.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
      tw.yaw += d * Math.min(1, dt * 10);
      if (tw.cd <= 0) { fire(tw, e); tw.cd = stat(tw, 'rate'); }
    }
  }
  // arrows: fast homing shots
  for (const a of arrows.items) {
    if (a.e.alive) { a.tx = a.e.x; a.tz = a.e.z; }
    const dx = a.tx - a.x, dy = 0.9 - a.y, dz = a.tz - a.z, dist = Math.hypot(dx, dy, dz), step = 32 * dt;
    a.life -= dt;
    if (dist <= step + 0.3) {
      if (a.e.alive) { damage(a.e, a.dmg, a.tw, 'arrow'); emit(a.tx, 0.9, a.tz, 3, 0xf1e3c4, 1.5, 0.3); sfx('hit'); }
      a.life = 0;
    } else { a.x += dx / dist * step; a.y += dy / dist * step; a.z += dz / dist * step; a.dx = dx / dist; a.dy = dy / dist; a.dz = dz / dist; }
  }
  arrows.items = arrows.items.filter(a => a.life > 0);
  // cannonballs and tar: ballistic arcs with splash on landing
  for (const list of [balls, tars]) {
    for (const b of list.items) {
      b.t += dt;
      if (b.t >= b.T) {
        b.done = true;
        const tw = b.tw, r = stat(tw, 'splash');
        for (const e of G.enemies) {
          if (!e.alive) continue;
          const d = Math.hypot(e.x - b.x1, e.z - b.z1);
          if (d > r) continue;
          if (list === balls) damage(e, stat(tw, 'dmg') * (1 - 0.45 * d / r), tw, 'ball');
          else {
            e.dotDps = Math.max(e.dotT > 0 ? e.dotDps : 0, stat(tw, 'dps'));
            e.dotT = 3; e.dotTower = tw;
            e.slowT = 2.6; e.slowF = Math.min(e.slowF, stat(tw, 'slow'));
          }
        }
        if (list === balls) { emit(b.x1, 0.4, b.z1, 22, 0x9b8a6e, 5, 0.6); emit(b.x1, 0.4, b.z1, 8, 0xffb347, 3, 0.35); shake = Math.max(shake, 0.18); sfx('impact'); }
        else {
          emit(b.x1, 0.3, b.z1, 14, 0x2a1a0e, 3, 0.5);
          if (puddles.items.length < 40) puddles.items.push({ x: b.x1, z: b.z1, r, life: 3, max: 3, slow: stat(tw, 'slow') });
          sfx('splash');
        }
      }
    }
    list.items = list.items.filter(b => !b.done);
  }
  // tar puddles keep slowing whoever walks through them
  for (const p of puddles.items) {
    p.life -= dt;
    for (const e of G.enemies) if (e.alive && Math.hypot(e.x - p.x, e.z - p.z) < p.r) { e.slowT = Math.max(e.slowT, 0.3); e.slowF = Math.min(e.slowF, p.slow); }
  }
  puddles.items = puddles.items.filter(p => p.life > 0);
  // cleanup + wave end
  if (G.enemies.some(e => !e.alive)) G.enemies = G.enemies.filter(e => e.alive);
  if (G.phase === 'wave' && !G.queue.length && !G.enemies.length) {
    G.phase = 'build';
    const b = G.pendingBonus; G.pendingBonus = 0;
    addGold(b);
    toast(t('cleared', { n: b }));
    saveBest(G.wave);
    sfx('clear');
    if (G.wave >= MAX_WAVES && !G.endless) endGame(true);
    updateHUD();
  }
}

    if (pPos[i * 3 + 1] < 0.05 && pg[i] < 0) { pPos[i * 3 + 1] = 0.05; pv[i * 3] *= 0.6; pv[i * 3 + 2] *= 0.6; pv[i * 3 + 1] = 0; }
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;

  // ambient life: water, boats, camp smoke
  const wp = water.geometry.attributes.position;
  for (let i = 0; i < wp.count; i++) {
    const x = waterBase[i * 3], z = waterBase[i * 3 + 2];
    wp.array[i * 3 + 1] = Math.sin(x * 0.35 + time * 1.1) * 0.12 + Math.cos(z * 0.28 + time * 0.8) * 0.1;
  }
  wp.needsUpdate = true;
  for (const b of boats) {
    b.z += b.dir * b.sp * dt;
    if (Math.abs(b.z) > 34) b.dir *= -1;
    b.m.position.set(b.x + Math.sin(time * 0.3 + b.x) * 2, -0.45 + Math.sin(time * 1.4 + b.x) * 0.08, b.z);
    b.m.rotation.set(Math.sin(time * 1.2 + b.x) * 0.04, b.dir > 0 ? 0 : Math.PI, Math.cos(time * 1.1) * 0.05);
  }
  smokeT -= dt;
  if (smokeT <= 0) {
    smokeT = LOW ? 0.5 : 0.25;
    for (const [x, z] of campFires) { emit(x, heightAt(x, z) + 0.4, z, 1, 0x8f8a84, 0.6, 3.2, 0.6, 0.4); emit(x, heightAt(x, z) + 0.3, z, 1, 0xff9a3c, 0.8, 0.5, 1, 0.3); }
  }
  // selection ring pulse
  if (ring.visible) { const k = 1 + Math.sin(time * 4) * 0.012; ring.scale.set(ringR * k, 1, ringR * k); disc.scale.set(ringR, 1, ringR); }
}
let smokeT = 0;

// ---------------------------------------------------------------- picking + panels
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let sel = null, hoverPad = -1, ringR = 1;
function pick(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const objs = [padMesh, ...G.towers.map(tw => tw.base), ...G.towers.map(tw => tw.head)];
  const hit = raycaster.intersectObjects(objs, false)[0];
  if (!hit) return null;
  if (hit.object === padMesh) return pads[hit.instanceId];
  return hit.object.userData.pad || G.towers.find(tw => tw.head === hit.object)?.pad || null;
}
function setPadColor(i, hex) { if (i >= 0) { padMesh.setColorAt(i, _c.set(hex)); padMesh.instanceColor.needsUpdate = true; } }
function refreshPadColors() {
  for (const p of pads) setPadColor(p.i, sel && sel.pad === p ? 0xffd27a : p.i === hoverPad && !p.tower ? 0xfff0c8 : 0xffffff);
}
function showRing(x, z, r) { ring.position.set(x, 0.36, z); disc.position.set(x, 0.35, z); ringR = r; ring.visible = disc.visible = true; ring.scale.set(r, 1, r); disc.scale.set(r, 1, r); }
function hideRing() { ring.visible = disc.visible = false; }

const panel = document.getElementById('panel');
function closePanel() { sel = null; panel.classList.add('hidden'); hideRing(); refreshPadColors(); }
function selectPad(pad) {
  if (!pad) { closePanel(); return; }
  if (pad.tower) showTower(pad.tower); else showBuild(pad);
  sfx('click');
}
function showBuild(pad) {
  sel = { pad };
  panel.innerHTML = `<div class="ph"><span>${t('build')}</span><button class="x" data-act="close">✕</button></div><div class="cards">` +
    TOWER_KEYS.map((k, i) => {
      const T = TOWERS[k], c = T.cost[0];
      return `<button class="card" data-act="build" data-type="${k}" ${G.gold < c ? 'disabled' : ''}><kbd>${i + 1}</kbd><span class="ico">${T.icon}</span><b>${t(k + 'Name')}</b><small>${t(k + 'Desc')}</small><span class="cost">💰 ${c}</span></button>`;
    }).join('') + '</div>';
  panel.classList.remove('hidden');
  hideRing();
  refreshPadColors();
}
function fmt(v) { return typeof v === 'number' && !Number.isInteger(v) ? v.toFixed(1) : v; }
function showTower(tw) {
  sel = { pad: tw.pad, tower: tw };
  const T = TOWERS[tw.type], L = tw.level, nx = L < 2 ? L + 1 : null;
  const row = (label, key, f = v => v) => {
    const cur = f(T[key][L]), nxt = nx !== null ? f(T[key][nx]) : null;
    return `<div><span>${label}</span><b>${fmt(cur)}${nxt !== null && nxt !== cur ? ` <span class="up">→ ${fmt(nxt)}</span>` : ''}</b></div>`;
  };
  let rows = row(t('range'), 'range');
  if (tw.type === 'tar') rows += row(t('dps'), 'dps') + row(t('slow'), 'slow', v => Math.round((1 - v) * 100) + '%');
  else rows += row(t('dmg'), 'dmg');
  rows += row(t('rate'), 'rate', v => +(1 / v).toFixed(1));
  if (T.splash) rows += row(t('splash'), 'splash');
  rows += `<div><span>${t('kills')}</span><b>${tw.kills}</b></div>`;
  const up = nx !== null ? T.cost[nx] : 0, refund = Math.floor(tw.spent * 0.7);
  const modeName = { first: t('mFirst'), strong: t('mStrong'), near: t('mNear') }[tw.mode];
  panel.innerHTML = `<div class="ph"><span>${T.icon} ${t(tw.type + 'Name')}<span class="lvl">${[0, 1, 2].map(i => `<i class="${i <= L ? 'on' : ''}"></i>`).join('')}</span></span><button class="x" data-act="close">✕</button></div>
    <div class="tw"><div class="tstats">${rows}</div><div class="tbtns">
      <button class="primary" data-act="upgrade" ${nx === null || G.gold < up ? 'disabled' : ''}>${nx === null ? t('maxed') : `⬆ ${t('upgrade')} · 💰 ${up}`}</button>
      <button data-act="mode">🎯 ${t('target')}: ${modeName}</button>
      <button data-act="sell">${t('sell')} · +${refund}</button></div></div>`;
  panel.classList.remove('hidden');
  showRing(tw.pad.x, tw.pad.z, stat(tw, 'range'));
  refreshPadColors();
}
function refreshPanel() {
  if (!sel) return;
  if (sel.tower) { if (G.towers.includes(sel.tower)) showTower(sel.tower); else closePanel(); }
  else if (!sel.pad.tower) {
    panel.querySelectorAll('[data-act="build"]').forEach(b => { b.disabled = G.gold < TOWERS[b.dataset.type].cost[0]; });
  } else showTower(sel.pad.tower);
}
panel.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b || b.disabled) return;
  initAudio();
  const act = b.dataset.act;
  if (act === 'close') closePanel();
  else if (act === 'build' && sel) { if (buildTower(sel.pad, b.dataset.type)) showTower(sel.pad.tower); }
  else if (act === 'upgrade' && sel?.tower) upgradeTower(sel.tower);
  else if (act === 'sell' && sel?.tower) sellTower(sel.tower);
  else if (act === 'mode' && sel?.tower) { const order = ['first', 'strong', 'near']; sel.tower.mode = order[(order.indexOf(sel.tower.mode) + 1) % 3]; showTower(sel.tower); sfx('click'); }
});
panel.addEventListener('mouseover', ev => {
  const b = ev.target.closest('[data-act="build"]');
  if (b && sel && !sel.tower) showRing(sel.pad.x, sel.pad.z, TOWERS[b.dataset.type].range[0]);
});
panel.addEventListener('mouseleave', () => { if (sel && !sel.tower) hideRing(); });

let down = null;
canvas.addEventListener('pointerdown', ev => { down = { x: ev.clientX, y: ev.clientY }; });
canvas.addEventListener('pointerup', ev => {
  if (!down || !G.running) return;
  const moved = Math.hypot(ev.clientX - down.x, ev.clientY - down.y);
  down = null;
  if (moved > 6 || ev.button !== 0) return;
  initAudio();
  selectPad(pick(ev.clientX, ev.clientY));
});
let lastMove = null;
canvas.addEventListener('pointermove', ev => { lastMove = { x: ev.clientX, y: ev.clientY }; });

// ---------------------------------------------------------------- HUD
const $ = id => document.getElementById(id);
function bump(id) { const el = $(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
let lastGold = -1;
function updateHUD() {
  $('sGold').querySelector('span').textContent = G.gold;
  $('sLives').querySelector('span').textContent = G.lives;
  $('sWave').querySelector('span').textContent = `${t('wave')} ${G.wave}/${G.endless ? '∞' : MAX_WAVES}`;
  $('sGold').title = t('gold'); $('sLives').title = t('lives');
  const nextW = G.wave + 1, bw = $('bWave');
  const canCall = G.running && !G.over && !G.queue.length && (G.endless || nextW <= MAX_WAVES);
  bw.disabled = !canCall;
  bw.textContent = G.queue.length ? t('waveRunning', { n: G.wave }) : canCall ? t(G.phase === 'wave' ? 'callEarly' : 'startWave', { n: nextW }) : '—';
  bw.classList.toggle('pulse', canCall && G.phase === 'build');
  $('tNext').textContent = t('next');
  const wc = (G.endless || nextW <= MAX_WAVES) ? waveCounts(nextW) : {};
  $('wavePreview').innerHTML = ENEMY_KEYS.filter(k => wc[k]).map(k => `<span title="${t(k)}">${ENEMIES[k].icon} ${wc[k]}</span>`).join('');
  if (G.gold !== lastGold) { lastGold = G.gold; refreshPanel(); }
}
function toast(msg) {
  const box = $('toast'), d = document.createElement('div');
  d.textContent = msg;
  box.appendChild(d);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => d.remove(), 2600);
}
const ftxt = [], ftxtLayer = $('ftxt');
function floatText(s, x, y, z) {
  if (ftxt.length > 24) return;
  const el = document.createElement('div');
  el.textContent = s;
  ftxtLayer.appendChild(el);
  ftxt.push({ el, x, y, z, life: 1 });
}
function updateFloatText(dt) {
  for (const f of ftxt) {
    f.life -= dt; f.y += dt * 1.6;
    _v.set(f.x, f.y, f.z).project(camera);
    f.el.style.transform = `translate(${(_v.x * 0.5 + 0.5) * innerWidth - 12}px, ${(-_v.y * 0.5 + 0.5) * innerHeight - 10}px)`;
    f.el.style.opacity = Math.min(1, f.life * 2);
    if (f.life <= 0) f.el.remove();
  }
  for (let i = ftxt.length - 1; i >= 0; i--) if (ftxt[i].life <= 0) ftxt.splice(i, 1);
}
function applyLang() {
  document.documentElement.lang = lang;
  $('tSub').textContent = t('sub');
  $('bLang').textContent = lang === 'tr' ? 'EN' : 'TR';
  $('pauseTag').textContent = t('paused');
  document.title = 'Hisar · ' + t('sub');
  updateHUD();
  if (sel) { if (sel.tower) showTower(sel.tower); else showBuild(sel.pad); }
  if (!G.running && !G.over) showTitle();
}
$('bLang').onclick = () => { lang = lang === 'tr' ? 'en' : 'tr'; try { localStorage.setItem('hisar.lang', lang); } catch (e) { /* ignore */ } applyLang(); };
$('bWave').onclick = () => { initAudio(); startWave(); };
const setSpeed = s => { G.speed = s; $('bSpeed').textContent = s + '×'; };
$('bSpeed').onclick = () => setSpeed(G.speed === 3 ? 1 : G.speed + 1);
const togglePause = () => { if (!G.running || G.over) return; G.paused = !G.paused; $('bPause').textContent = G.paused ? '▶' : '⏸'; $('pauseTag').style.display = G.paused ? 'block' : 'none'; };
$('bPause').onclick = togglePause;
$('bSound').onclick = () => { initAudio(); muted = !muted; $('bSound').textContent = muted ? '🔇' : '🔊'; };

window.addEventListener('keydown', ev => {
  if (ev.repeat) return;
  const k = ev.key.toLowerCase();
  if (k === ' ') { ev.preventDefault(); initAudio(); startWave(); }
  else if (k === 'p') togglePause();
  else if (k === 'f') $('bSpeed').click();
  else if (k === 'escape') closePanel();
  else if (sel && !sel.tower && ['1', '2', '3'].includes(k)) { if (buildTower(sel.pad, TOWER_KEYS[+k - 1])) showTower(sel.pad.tower); }
  else if (sel?.tower && k === 'u') upgradeTower(sel.tower);
  else if (sel?.tower && k === 's') sellTower(sel.tower);
});

// ---------------------------------------------------------------- screens
const overlay = $('overlay'), ocard = $('ocard');
function showTitle() {
  const best = loadBest();
  ocard.innerHTML = `<h1>🏰 Hisar<small>${t('sub')}</small></h1><p>${t('intro')}</p>
    <div class="row"><button class="primary big" id="bPlay">${t('play')} ▶</button><button id="bLang2">${lang === 'tr' ? 'English' : 'Türkçe'}</button></div>
    <p class="ctl">${t('controls')}</p>${best ? `<div class="best">🏆 ${t('best', { n: best })}</div>` : ''}`;
  overlay.classList.remove('hidden');
  $('bPlay').onclick = startGame;
  $('bLang2').onclick = () => $('bLang').click();
}
function startGame() {
  initAudio();
  overlay.classList.add('hidden');
  G.running = true;
  sfx('horn');
  toast(t('hint'));
  updateHUD();
}
function endGame(win) {
  G.over = true;
  saveBest(win ? G.wave : G.wave - 1);
  closePanel();
  sfx(win ? 'win' : 'lose');
  ocard.innerHTML = `<h1>${win ? '🏆 ' + t('winTitle') : '🔥 ' + t('lostTitle')}</h1><p>${win ? t('winText') : t('lostText', { n: G.wave })}</p>
    <div class="estats"><div><b>${G.kills}</b><small>${t('statKills')}</small></div><div><b>${G.goldEarned}</b><small>${t('statGold')}</small></div><div><b>${G.built}</b><small>${t('statTowers')}</small></div></div>
    <div class="row"><button class="primary big" id="bAgain">${t('again')}</button>${win ? `<button class="big" id="bEndless">${t('endless')}</button>` : ''}</div>`;
  overlay.classList.remove('hidden');
  $('bAgain').onclick = () => location.reload();
  if (win) $('bEndless').onclick = () => { G.over = false; G.endless = true; overlay.classList.add('hidden'); toast(t('endlessOn')); updateHUD(); };
}

// ---------------------------------------------------------------- audio (all synthesised)
let ac = null, master = null, noiseBuf = null, muted = AUTO;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.32; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function tone(f, dur, type = 'sine', vol = 0.3, f2 = null, delay = 0) {
  const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, freq, type = 'lowpass', delay = 0, q = 1) {
  const t0 = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f).connect(g).connect(master); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
}
const lastSfx = {};
function sfx(name) {
  if (!ac || muted || ac.state !== 'running') return;
  const now = ac.currentTime, gap = { bow: 0.06, hit: 0.05, coin: 0.07, boom: 0.08, impact: 0.08, lob: 0.1, splash: 0.1 }[name] ?? 0.03;
  if (lastSfx[name] && now - lastSfx[name] < gap) return;
  lastSfx[name] = now;
  switch (name) {
    case 'bow': noise(0.08, 0.12, 2800, 'bandpass', 0, 2); tone(420, 0.07, 'triangle', 0.05, 180); break;
    case 'hit': noise(0.05, 0.08, 1200, 'bandpass', 0, 3); break;
    case 'boom': noise(0.4, 0.5, 420); tone(110, 0.35, 'sine', 0.4, 40); break;
    case 'impact': noise(0.3, 0.3, 700); tone(80, 0.25, 'sine', 0.25, 35); break;
    case 'lob': tone(260, 0.16, 'triangle', 0.08, 140); break;
    case 'splash': noise(0.22, 0.18, 500, 'lowpass', 0, 4); break;
    case 'coin': tone(1320, 0.06, 'square', 0.04); tone(1760, 0.09, 'square', 0.04, null, 0.05); break;
    case 'build': noise(0.15, 0.2, 300); tone(196, 0.12, 'triangle', 0.15, null, 0.02); tone(294, 0.15, 'triangle', 0.12, null, 0.1); break;
    case 'click': tone(660, 0.04, 'triangle', 0.06); break;
    case 'deny': tone(180, 0.15, 'square', 0.06, 140); break;
    case 'hurt': noise(0.35, 0.35, 260); tone(150, 0.3, 'sawtooth', 0.12, 70); break;
    case 'horn': [146.8, 220, 293.7].forEach((f, i) => tone(f, 0.9, 'sawtooth', 0.06, f * 0.98, i * 0.03)); break;
    case 'clear': [523, 659, 784].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, null, i * 0.1)); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.5, 'triangle', 0.12, null, i * 0.16)); break;
    case 'lose': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.5, 'sawtooth', 0.07, null, i * 0.22)); break;
  }
}

// ---------------------------------------------------------------- autoplay bot (?auto) for self-testing
const autoPlan = ['archer', 'archer', 'cannon', 'tar', 'archer', 'cannon', 'archer', 'tar', 'cannon', 'archer'];
const autoPads = [...pads].sort((a, b) => Math.hypot(a.x - 12, a.z) - Math.hypot(b.x - 12, b.z));
let autoT = 0, autoBuildIdx = 0;
function autoplay(dt) {
  autoT -= dt;
  if (autoT > 0) return;
  autoT = 0.5;
  const free = autoPads.find(p => !p.tower);
  const type = autoPlan[autoBuildIdx % autoPlan.length];
  const upgr = G.towers.filter(tw => tw.level < 2).sort((a, b) => TOWERS[a.type].cost[a.level + 1] - TOWERS[b.type].cost[b.level + 1])[0];
  if (free && G.gold >= TOWERS[type].cost[0] && (G.towers.length < 8 || !upgr || G.gold > 260)) { buildTower(free, type); autoBuildIdx++; }
  else if (upgr && G.gold >= TOWERS[upgr.type].cost[upgr.level + 1]) upgradeTower(upgr);
  if (G.phase === 'build' && !G.over) startWave();
}

// ---------------------------------------------------------------- loop
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.addEventListener('visibilitychange', () => { if (ac) { if (document.hidden) ac.suspend(); else ac.resume(); } });
const clock = new THREE.Clock();
let time = 0, perfT = 0, hoverT = 0;
const minT = new THREE.Vector3(-46, 0, -32), maxT = new THREE.Vector3(40, 0, 32);
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  time += dt;
  const active = G.running && !G.over && !G.paused && !document.hidden;
  if (active) {
    if (AUTO) autoplay(dt * G.speed);
    let sim = dt * G.speed;
    while (sim > 1e-6 && !G.over) { const s = Math.min(0.025, sim); update(s); sim -= s; }
  }
  updateVisuals(active ? dt * G.speed : (G.paused ? 0 : dt), time);
  updateFloatText(dt);
  // hover highlight (throttled)
  hoverT -= dt;
  if (lastMove && hoverT <= 0 && G.running) {
    hoverT = 0.06;
    const p = pick(lastMove.x, lastMove.y), h = p ? p.i : -1;
    canvas.style.cursor = p ? 'pointer' : '';
    if (h !== hoverPad) { hoverPad = h; refreshPadColors(); }
  }
  // title screen: slow cinematic orbit
  if (!G.running) {
    const a = time * 0.05;
    camera.position.set(Math.sin(a) * 62 - 2, 40, Math.cos(a) * 62);
    controls.target.set(-2, 0, 0);
  }
  controls.update();
  const before = controls.target.clone();
  controls.target.clamp(minT, maxT);
  camera.position.add(before.sub(controls.target).negate());
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 1.5);
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    camera.position.x += sx; camera.position.y += sy;
    renderer.render(scene, camera);
    camera.position.x -= sx; camera.position.y -= sy;
  } else renderer.render(scene, camera);
  if (DEBUG && (perfT += dt) > 5) { perfT = 0; console.log('[hisar] draw calls', renderer.info.render.calls, 'tris', renderer.info.render.triangles); }
}

// ?debug: fast-forward the simulation without rendering, for balance tests
if (DEBUG) window.hisarSim = (seconds, withBot = true) => {
  for (let s = 0; s < seconds && !G.over; s += 0.025) { if (withBot) autoplay(0.025); update(0.025); }
  return { wave: G.wave, lives: G.lives, gold: G.gold, towers: G.towers.map(tw => tw.type[0] + tw.level).join(' '), over: G.over, errors: G.errors.length };
};

applyLang();
if (AUTO) { setSpeed(3); startGame(); }
G.pads = pads.length;
frame();
</script>
